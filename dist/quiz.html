<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rules of the Road Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one centered column, like a single card on a chart table. Port red = wrong, starboard green = right. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #102a3c;
  --muted: #557083;
  --line: #d3dde4;
  --accent: #1d5f8c;
  --accent-ink: #ffffff;
  --port: #c2332b;
  --port-soft: #fbe9e7;
  --stbd: #1e8a4c;
  --stbd-soft: #e5f4ea;
  --amber: #b4770f;
  --amber-soft: #fbf1dc;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1721; --surface: #12222f; --ink: #e3edf3; --muted: #93abbb; --line: #24394a;
    --accent: #5ba7da; --accent-ink: #06121b;
    --port: #ef6b62; --port-soft: #3a1c1b; --stbd: #4cc27f; --stbd-soft: #15301f;
    --amber: #e3a841; --amber-soft: #33270f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1721; --surface: #12222f; --ink: #e3edf3; --muted: #93abbb; --line: #24394a;
  --accent: #5ba7da; --accent-ink: #06121b;
  --port: #ef6b62; --port-soft: #3a1c1b; --stbd: #4cc27f; --stbd-soft: #15301f;
  --amber: #e3a841; --amber-soft: #33270f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.1rem;
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.lights { display: flex; gap: 6px; align-items: center; }
.lights span { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights .r { background: var(--port); }
.lights .w { background: var(--surface); border: 2px solid var(--muted); }
.lights .g { background: var(--stbd); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.35rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-wrap: balance;
}
.label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Setup */
.sections { display: flex; flex-direction: column; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
}
.check:hover { border-color: var(--accent); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check .name { flex: 1; min-width: 0; }
.check .count { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--ink);
  padding: 8px 6px; font: inherit; font-size: 0.9rem; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { margin: 0; color: var(--muted); font-size: 0.85rem; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600;
  padding: 11px 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.25s ease; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em;
  padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--line); color: var(--muted);
}
.tag.rule { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.question { font-size: 1.15rem; line-height: 1.45; margin: 0; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  width: 100%;
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .key {
  flex: none; width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem;
  border: 1.5px solid var(--line);
}
.choice .txt { flex: 1; min-width: 0; padding-top: 2px; }
.choice.selected { border-color: var(--accent); }
.choice.selected .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice.right { border-color: var(--stbd); background: var(--stbd-soft); }
.choice.right .key { background: var(--stbd); border-color: var(--stbd); color: #fff; }
.choice.wrong { border-color: var(--port); background: var(--port-soft); }
.choice.wrong .key { background: var(--port); border-color: var(--port); color: #fff; }
.choice:disabled { cursor: default; }

.feedback { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.feedback.right { background: var(--stbd-soft); border-left: 4px solid var(--stbd); }
.feedback.wrong { background: var(--port-soft); border-left: 4px solid var(--port); }
.feedback strong { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.03em; text-transform: uppercase; }
.feedback p { margin: 0; }
.src { color: var(--muted); font-size: 0.85rem; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.kbd-hint { color: var(--muted); font-size: 0.8rem; margin: 0; }

/* Results */
.score { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.score .big {
  font-family: var(--font-display); font-weight: 700; font-size: 4rem; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.score .big.pass { color: var(--stbd); }
.score .big.fail { color: var(--port); }
.score .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.review { display: flex; flex-direction: column; gap: 12px; }
.review-item { border: 1px solid var(--line); border-left: 4px solid var(--port); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.review-item p { margin: 0; }
.review-item .yours { color: var(--port); }
.review-item .correct { color: var(--stbd); font-weight: 600; }

footer { color: var(--muted); font-size: 0.8rem; text-align: center; }

@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
@media (max-width: 480px) {
  .brand h1 { font-size: 1.7rem; }
  .card { padding: 16px; }
  .question { font-size: 1.05rem; }
  .score .big { font-size: 3.2rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Rules of the Road</h1>
      <p>Navigation Rules practice test · International &amp; Inland · <span id="total-count">0</span> questions</p>
    </div>
    <div class="lights" aria-hidden="true"><span class="r"></span><span class="w"></span><span class="g"></span></div>
  </header>
  <main id="app"></main>
  <footer>Questions from the U.S. Maritime Academy Rules of the Road practice problems, based on the USCG Navigation Rules and Regulations Handbook.</footer>
</div>
<script>
  window.QUIZ_SECTIONS = [];
  function addSection(s) { window.QUIZ_SECTIONS.push(s); }
</script>
<script>
// Rules 1-9 — transcribed from the U.S. Maritime Academy "Rules of the Road" practice problems.
// Format: [number, rule, question, [choices A..D], answer, flags]
// Answers come from the book's answer key unless flagged {src:"rules"}.
// flags.diagram = true → question refers to a diagram that is not reproduced here.

addSection({
  id: "r1-9-both",
  title: "Rules 1–9 · International & Inland",
  questions: [
    [1, "Rule 1", "You are on a vessel that cannot comply with the spacing requirement for masthead lights due to the nature of the vessel's function. What is required in this situation?", [
      "The vessel must carry only the lights that comply with the rules; the others may be omitted.",
      "The vessel's lights must comply as closely as possible, as determined by her government.",
      "The vessel must be altered to permit full compliance with the rules.",
      "An all-around light should be substituted for the aft masthead light and the sternlight."], "B"],
    [2, "Rule 2", "According to the Navigation Rules, you may depart from the Rules when", [
      "no vessels are in sight visually.",
      "no vessels are visible on radar.",
      "you are in immediate danger.",
      "out of sight of land."], "C"],
    [3, "Rule 2", "In complying with the Rules, of what must the mariner regard?", [
      "Limited backing power of his vessel.",
      "Radar information about nearby vessels.",
      "The occupation of the other vessel, if known.",
      "All of the above."], "D"],
    [4, "Rule 2", "The Rules state that vessels may depart from the requirements of the Rules when", [
      "there are no other vessels around.",
      "operating in a narrow channel.",
      "the Master enters it in the ship's log.",
      "necessary to avoid immediate danger."], "D"],
    [5, "Rule 3", "You are on watch in fog. Which of the following vessels is in sight?", [
      "A vessel that you can see from the bridge.",
      "A radar target of which you have determined the course and speed.",
      "A vessel of which you can hear the fog signal.",
      "All of the above."], "A"],
    [6, "Rule 3", "Which vessel is \"underway\" under the Rules of the Road?", [
      "A vessel at anchor with the engine running.",
      "A vessel with a line led to a tree onshore.",
      "A vessel drifting with the engine off.",
      "A vessel aground."], "C"],
    [7, "Rule 3", "The NAVIGATION RULES define a \"vessel not under command\" as a vessel which", [
      "from the nature of her work is unable to keep out of the way of another vessel.",
      "through some exceptional circumstance is unable to maneuver as required by the rules.",
      "by taking action contrary to the rules has created a special circumstance situation.",
      "is moored, aground or anchored in a fairway."], "B"],
    [8, "Rule 3", "Breadth refers to the", [
      "greatest breadth.",
      "molded breadth.",
      "breadth on the main deck.",
      "breadth at the load waterline."], "A"],
    [9, "Rule 3", "What does the word \"length\" refer to?", [
      "Length between the perpendiculars.",
      "Length overall.",
      "Waterline length.",
      "Register length."], "B"],
    [10, "Rule 3", "Which of the following is NOT a vessel \"restricted in her ability to maneuver\"?", [
      "A vessel laying mat revetments for bank protection along a channel.",
      "A vessel towing with severely limited maneuverability.",
      "A deep-draft vessel.",
      "A vessel underway with a boat alongside and taking on fuel."], "C"],
    [11, "Rule 3", "Which of the following is a vessel \"restricted in her ability to maneuver\"?", [
      "A vessel not under command.",
      "A vessel constrained by her draft.",
      "A vessel underway in fog.",
      "A vessel towing that is severely restricted in its maneuverability."], "D"],
    [12, "Rule 3", "A vessel \"restricted in her ability to maneuver\" is one which", [
      "from the nature of her work is unable to maneuver as required by the rules.",
      "through some exceptional circumstance is unable to maneuver as required by the rules.",
      "due to adverse weather conditions is unable to maneuver as required by the rules.",
      "has lost steering and is unable to maneuver."], "A"],
    [13, "Rule 3", "A vessel that is defined as \"restricted in her ability to maneuver\" is unable to keep out of the way of another vessel due to", [
      "her draft.",
      "the nature of her work.",
      "some exceptional circumstances.",
      "a danger of navigation."], "B"],
    [14, "Rules 3, 24", "Which vessel is NOT to be regarded as \"restricted in her ability to maneuver\"?", [
      "A vessel transferring provisions while underway.",
      "A composite power driven vessel.",
      "A vessel servicing a navigation mark.",
      "A vessel launching aircraft."], "B"],
    [15, "Rule 3", "Which vessel is NOT classified as \"restricted in her ability to maneuver\"?", [
      "A vessel picking up a navigation mark.",
      "A vessel transferring cargo while underway.",
      "A vessel anchored.",
      "A vessel in a towing operation that restricts the ability of the vessel and her tow to change their course."], "C"],
    [16, "Rule 3", "According to the Rules, which vessel is NOT \"restricted in her ability to maneuver\"?", [
      "A vessel servicing a navigation marker.",
      "A sailing vessel.",
      "A vessel mineclearing.",
      "A vessel dredging."], "B"],
    [17, "Rule 3", "All of the following vessels shall be regarded as \"restricted in their ability to maneuver\" EXCEPT a vessel", [
      "laying a pipeline.",
      "dredging.",
      "mineclearing.",
      "not under command."], "D"],
    [18, "Rule 3", "Which vessel is regarded as a vessel \"restricted in her ability to maneuver\"?", [
      "A vessel fishing with trawls.",
      "A vessel which has lost use of her steering gear.",
      "A vessel with a draft of such depth that she cannot change her course.",
      "A vessel engaged in mineclearing."], "D"],
    [19, "Rule 3", "A vessel transferring cargo while underway is classified by the Rules as a vessel", [
      "not under command.",
      "in special circumstances.",
      "restricted in her ability to maneuver.",
      "constrained by her draft."], "C"],
    [20, "Rule 3", "Which vessel is considered to be a \"vessel restricted in her ability to maneuver\" under the Navigational Rules?", [
      "A vessel at anchor.",
      "A vessel dredging.",
      "A vessel fishing.",
      "A vessel towing."], "B"],
    [21, "Rule 3", "Which of the following is a \"vessel restricted in her ability to maneuver\"?", [
      "A deep-draft vessel that can only navigate in a dredged channel.",
      "A vessel fishing with a bottom trawl that must remain on course.",
      "A large tanker that is being towed as a dead ship to drydock.",
      "A vessel laying revetment mats to provide bank protection along a channel."], "D"],
    [22, "Rule 3", "The term \"restricted visibility\" as used in the Rules refers", [
      "only to fog.",
      "only to visibility of less than one-half of a mile.",
      "to visibility where you cannot see shore.",
      "to any condition where visibility is restricted."], "D"],
    [23, "Rule 3", "A vessel is \"in sight\" of another vessel when", [
      "she can be observed visually or by radar.",
      "she can see and be observed visually from the other vessel.",
      "she can be seen well enough to determine her heading.",
      "her fog signal can be heard."], "B"],
    [24, "Rule 3", "A vessel is being propelled both by sail and by engines. Under the Rules, the vessel is", [
      "considered a \"special circumstance\" vessel.",
      "not covered under any category.",
      "considered a sail vessel.",
      "considered a power-driven vessel."], "D"],
    [25, "Rule 3", "Which vessel is \"underway\" according to the Rules?", [
      "A vessel made fast to a single point mooring buoy.",
      "A fishing vessel hauling her nets.",
      "A pilot vessel at anchor.",
      "A vessel which has run aground."], "B"],
    [26, "Rule 3", "Which craft would be considered a \"power-driven vessel\" under the Rules of the Road?", [
      "An auxiliary sail vessel, using her engine.",
      "A canoe being propelled by a small outboard motor.",
      "A tug powered by a diesel engine.",
      "All of the above."], "D"],
    [27, "Rule 3", "The term \"power-driven vessel\" refers to any vessel", [
      "with propelling machinery onboard whether or not in use.",
      "making way against the current.",
      "with propelling machinery in use.",
      "traveling at a speed greater than that of the current."], "C"],
    [28, "Rule 3", "Which vessel by definition is unable to keep out of the way of another vessel?", [
      "Vessel engaged in fishing.",
      "Vessel restricted in her ability to maneuver.",
      "Sailing vessel.",
      "Vessel towing."], "B"],
    [29, "Rule 3", "For the purpose of the Rules, except where otherwise required, the term", [
      "\"vessel\" includes seaplanes.",
      "\"seaplane\" includes nondisplacement craft.",
      "\"vessel engaged in fishing\" includes a vessel sport fishing with trolling lines.",
      "\"vessel restricted in her ability to maneuver\" includes fishing vessels."], "A"],
    [30, "Rule 3", "The term \"vessel\" includes", [
      "seaplanes.",
      "nondisplacement craft.",
      "barges.",
      "all of the above."], "D"],
    [31, "Rule 3", "A vessel is \"engaged in fishing\" when", [
      "there are lines out.",
      "she is using any type of gear, other than lines.",
      "she is using fishing apparatus which restricts her maneuverability.",
      "she has any fishing gear on board."], "C"],
    [32, "Rule 3", "Which statement is true concerning a \"vessel engaged in fishing\"?", [
      "The vessel may be using nets, lines, or trawls.",
      "The vessel may be trolling.",
      "The vessel is classified as \"restricted in her ability to maneuver\".",
      "It sounds the same fog signal as a vessel underway but stopped."], "A"],
    [33, "Rule 3", "According to the Navigation Rules, all of the following are engaged in fishing EXCEPT a vessel", [
      "setting nets.",
      "trawling.",
      "using a dredge net.",
      "trolling."], "D"],
    [34, "Rule 3", "The word \"vessel\", in the Rules, includes", [
      "sailing ships.",
      "nondisplacement craft.",
      "seaplanes.",
      "all of the above."], "D"],
    [35, "Rule 5", "The rule regarding lookouts applies", [
      "in restricted visibility.",
      "between dusk and dawn.",
      "in heavy traffic.",
      "all of the above."], "D"],
    [36, "Rule 5", "A lookout shall be maintained", [
      "only at night.",
      "only during restricted visibility.",
      "at night, and during restricted visibility.",
      "at all times."], "D"],
    [37, "Rule 6", "A vessel must proceed at a safe speed", [
      "in restricted visibility.",
      "in congested waters.",
      "during darkness.",
      "at all times."], "D"],
    [38, "Rule 6", "\"Safe speed\" is defined as that speed where", [
      "you can stop within your visibility range.",
      "you can take proper and effective action to avoid collision.",
      "you are traveling slower than surrounding vessels.",
      "no wake comes from your vessel."], "B"],
    [39, "Rule 6", "The Navigation Rules state that a vessel shall be operated at a safe speed at all times so that she can be stopped within", [
      "the distance of visibility.",
      "1/2 the distance of visibility.",
      "a distance appropriate to existing circumstances and conditions.",
      "the distance that it would require for the propeller to go from full ahead to full astern."], "C"],
    [40, "Rule 6", "Which factor is listed in the Rules as one which must be taken into account when determining safe speed?", [
      "The construction of the vessel.",
      "The maneuverability of the vessel.",
      "The experience of vessel personnel.",
      "All of the above."], "B"],
    [41, "Rule 6", "The Rules state that certain factors are to be taken into account when determining safe speed. One of the factors stated is the", [
      "state of wind, sea and current, and the proximity of navigational hazards.",
      "maximum attainable speed of your vessel.",
      "temperature.",
      "aids to navigation that are available."], "A"],
    [42, "Rule 6", "In determining \"safe speed\", all of the following must be taken into account EXCEPT", [
      "the maximum horsepower of your vessel.",
      "the presence of background lights at night.",
      "the draft of your vessel.",
      "the maneuverability of your vessel."], "A"],
    [43, "Rule 7", "In order for there to be risk of collision, which condition(s) must be true?", [
      "The other vessel must be approaching.",
      "Your vessel must be power driven.",
      "The other vessel must be forward of your beam.",
      "All of the above."], "A"],
    [44, "Rule 7", "Risk of collision is considered to exist if", [
      "four vessels are nearby.",
      "a vessel has a steady bearing at a constant range.",
      "there is any doubt that a risk of collision exists.",
      "a special circumstance situation is apparent."], "C"],
    [45, "Rule 7", "In which situation would you consider a risk of collision to exist?", [
      "A vessel is two points on your port bow, range increasing, bearing changing slightly to the right.",
      "A vessel is broad on your starboard beam, range decreasing, bearing changing rapidly to the right.",
      "A vessel is two points abaft your port beam, range increasing, bearing is constant.",
      "A vessel is on your starboard quarter, range decreasing, bearing is constant."], "D"],
    [46, "Rule 7", "Which procedure(s) shall be used to determine risk of collision?", [
      "Watching the compass bearing of an approaching vessel.",
      "Systematic observation of objects detected by radar.",
      "Long-range radar scanning.",
      "All of the above."], "D"],
    [48, "Rule 7", "Risk of collision exists when an approaching vessel has a/an", [
      "steady bearing and decreasing range.",
      "generally steady range and increasing bearing.",
      "increasing range and bearing.",
      "decreasing bearing only."], "A"],
    [50, "Rule 7", "You are seeing another vessel approaching and its compass bearing is not significantly changing. This would indicate that", [
      "you are the stand-on vessel.",
      "risk of collision exists.",
      "a special circumstances situation exists.",
      "the other vessel is dead in the water."], "B"],
    [51, "Rule 7", "The Rules state that risk of collision is deemed to exist", [
      "whenever two vessels approach from opposite directions.",
      "if the bearing of an approaching vessel does not appreciably change.",
      "whenever a vessel crosses ahead of the intended track of another vessel.",
      "if one vessel approaches another so as to be overtaking."], "B"],
    [52, "Rule 7", "Which statement is true concerning a vessel equipped with operational radar?", [
      "She must use this equipment to obtain early warning of risk of collision.",
      "The radar equipment is only required to be used in restricted visibility.",

  const PASS_MARK = 90; // The Coast Guard Rules of the Road exam module requires 90%.
  const STORE_KEY = "rotr-quiz-v1";

  // ---------- Build the question bank ----------
  const bank = [];
  for (const sec of window.QUIZ_SECTIONS) {
    sec.items = [];
    for (const row of sec.questions) {
      const [num, rule, text, choices, answer, flags = {}] = row;
      const q = {
        id: sec.id + "-" + num,
        section: sec,
        num, rule, text, choices,
        answer: LETTERS.indexOf(answer),
        diagram: !!flags.diagram,
        fromRules: flags.src === "rules",
        note: flags.note || "",
      };
      sec.items.push(q);
      bank.push(q);
    }
  }
  const byId = new Map(bank.map((q) => [q.id, q]));

  // ---------- Saved settings + missed list (this browser only) ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch (e) { /* storage unavailable */ }
  }
  const saved = load();
  saved.missed = Array.isArray(saved.missed) ? saved.missed.filter((id) => byId.has(id)) : [];
  const settings = Object.assign(
    { sections: window.QUIZ_SECTIONS.map((s) => s.id), mode: "practice", count: "25", shuffle: true, diagrams: false },
    saved.settings || {}
  );

  // ---------- State ----------
  let quiz = null; // { list, idx, picks: [], checked: [] }

  const $ = (sel) => document.querySelector(sel);
  const app = $("#app");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pool() {
    return bank.filter((q) => settings.sections.includes(q.section.id) && (settings.diagrams || !q.diagram));
  }

  // ---------- Setup screen ----------
  function renderSetup() {
    quiz = null;
    const secRows = window.QUIZ_SECTIONS.map((s) => {
      const n = s.items.filter((q) => settings.diagrams || !q.diagram).length;
      return `<label class="check" for="sec-${s.id}">
        <input type="checkbox" id="sec-${s.id}" data-sec="${s.id}" ${settings.sections.includes(s.id) ? "checked" : ""}>
        <span class="name">${esc(s.title)}</span>
        <span class="count">${n} q</span>
      </label>`;
    }).join("");

    const seg = (name, opts) => opts.map(([val, label]) =>
      `<button type="button" data-${name}="${val}" aria-pressed="${settings[name] === val}">${label}</button>`).join("");

    const available = pool().length;
    const missedCount = saved.missed.length;

    app.innerHTML = `
      <section class="card" aria-labelledby="setup-h">
        <h2 id="setup-h">Build your test</h2>
        <div class="field">
          <span class="label">Sections</span>
          <div class="sections">${secRows}</div>
        </div>
        <div class="options">
          <div class="field">
            <span class="label">Mode</span>
            <div class="seg">${seg("mode", [["practice", "Practice"], ["exam", "Exam"]])}</div>
            <p class="hint">${settings.mode === "practice" ? "See the answer after each question." : "Answers are revealed at the end."}</p>
          </div>
          <div class="field">
            <span class="label">Questions</span>
            <div class="seg">${seg("count", [["10", "10"], ["25", "25"], ["50", "50"], ["all", "All"]])}</div>
            <p class="hint">${available} available with these settings.</p>
          </div>
        </div>
        <div class="field">
          <label class="toggle" for="opt-shuffle"><input type="checkbox" id="opt-shuffle" ${settings.shuffle ? "checked" : ""}> Shuffle question order</label>
          <label class="toggle" for="opt-diagrams"><input type="checkbox" id="opt-diagrams" ${settings.diagrams ? "checked" : ""}> Include questions that refer to a book diagram</label>
          <p class="hint">The diagrams aren't reproduced here, so those questions are off by default.</p>
        </div>
        <div class="actions">
          <button class="btn primary" id="start" ${available ? "" : "disabled"}>Start test</button>
          <button class="btn" id="start-missed" ${missedCount ? "" : "disabled"}>Retake missed (${missedCount})</button>
          ${missedCount ? `<button class="btn ghost" id="clear-missed">Clear missed list</button>` : ""}
        </div>
      </section>`;

    app.querySelectorAll("[data-sec]").forEach((el) => el.addEventListener("change", () => {
      settings.sections = [...app.querySelectorAll("[data-sec]:checked")].map((x) => x.dataset.sec);
      persistSettings(); renderSetup();
    }));
    app.querySelectorAll("[data-mode]").forEach((el) => el.addEventListener("click", () => {
      settings.mode = el.dataset.mode; persistSettings(); renderSetup();
    }));
    app.querySelectorAll("[data-count]").forEach((el) => el.addEventListener("click", () => {
      settings.count = el.dataset.count; persistSettings(); renderSetup();
    }));
    $("#opt-shuffle").addEventListener("change", (e) => { settings.shuffle = e.target.checked; persistSettings(); });
    $("#opt-diagrams").addEventListener("change", (e) => { settings.diagrams = e.target.checked; persistSettings(); renderSetup(); });
    $("#start").addEventListener("click", () => {
      let list = pool();
      if (settings.shuffle) list = shuffle(list);
      if (settings.count !== "all") list = list.slice(0, Number(settings.count));
      startQuiz(list);
    });
    $("#start-missed").addEventListener("click", () => {
      startQuiz(shuffle(saved.missed.map((id) => byId.get(id))));
    });
    const clr = $("#clear-missed");
    if (clr) clr.addEventListener("click", () => { saved.missed = []; save(); renderSetup(); });
  }
  function persistSettings() { saved.settings = settings; save(); }

  // ---------- Quiz screen ----------
  function startQuiz(list) {
    quiz = { list, idx: 0, picks: new Array(list.length).fill(-1), checked: new Array(list.length).fill(false) };
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    const { list, idx, picks, checked } = quiz;
    const q = list[idx];
    const practice = settings.mode === "practice";
    const pick = picks[idx];
    const done = practice && checked[idx];
    const answeredCount = picks.filter((p) => p >= 0).length;

    const choices = q.choices.map((c, i) => {
      let cls = "choice";
      if (done) {
        if (i === q.answer) cls += " right";
        else if (i === pick) cls += " wrong";
      } else if (i === pick) cls += " selected";
      return `<button class="${cls}" data-choice="${i}" ${done ? "disabled" : ""}>
        <span class="key">${LETTERS[i]}</span><span class="txt">${esc(c)}</span></button>`;
    }).join("");

    let feedback = "";
    if (done) {
      const ok = pick === q.answer;
      feedback = `<div class="feedback ${ok ? "right" : "wrong"}" role="status">
        <strong>${ok ? "Correct" : "Incorrect"}</strong>
        ${ok ? "" : `<p>The answer is <b>${LETTERS[q.answer]}</b>: ${esc(q.choices[q.answer])}</p>`}
        ${q.note ? `<p>${esc(q.note)}</p>` : ""}
        <p class="src">${q.fromRules ? "Answer worked out from the Navigation Rules (book key not yet added)." : "Answer from the book's answer key."}</p>
      </div>`;
    }

    const last = idx === list.length - 1;
    let nextLabel, nextDisabled;
    if (practice) {
      nextLabel = done ? (last ? "See results" : "Next question") : "Check answer";
      nextDisabled = pick < 0;
    } else {
      nextLabel = last ? "Finish test" : "Next question";
      nextDisabled = false;
    }

    app.innerHTML = `
      <div class="progress">
        <div class="progress-row">
          <span class="label">Question ${idx + 1} of ${list.length}</span>
          <span class="label">${practice ? "Practice" : `${answeredCount} answered`}</span>
        </div>
        <div class="bar"><div style="width:${((idx + (done ? 1 : 0)) / list.length) * 100}%"></div></div>
      </div>
      <section class="card" aria-live="polite">
        <div class="tags">
          <span class="tag rule">${esc(q.rule)}</span>
          <span class="tag">${esc(q.section.title)} · #${q.num}</span>
          ${q.diagram ? `<span class="tag warn">Book diagram not shown</span>` : ""}
        </div>
        <p class="question">${esc(q.text)}</p>
        <div class="choices">${choices}</div>
        ${feedback}
        <div class="nav">
          <div class="actions">
            ${!practice && idx > 0 ? `<button class="btn" id="prev">Back</button>` : ""}
            <button class="btn ghost" id="quit">End test</button>
          </div>
          <button class="btn primary" id="next" ${nextDisabled ? "disabled" : ""}>${nextLabel}</button>
        </div>
        <p class="kbd-hint">Keyboard: press A–D or 1–4 to choose, Enter to continue.</p>
      </section>`;

    app.querySelectorAll("[data-choice]").forEach((el) =>
      el.addEventListener("click", () => choose(Number(el.dataset.choice))));
    $("#next").addEventListener("click", advance);
    $("#quit").addEventListener("click", finish);
    const prev = $("#prev");
    if (prev) prev.addEventListener("click", () => { quiz.idx--; renderQuestion(); });
  }

  function choose(i) {
    if (!quiz) return;
    const { idx, checked } = quiz;
    if (settings.mode === "practice" && checked[idx]) return;
    if (i >= quiz.list[idx].choices.length) return;
    quiz.picks[idx] = i;
    renderQuestion();
  }

  function advance() {
    if (!quiz) return;
    const { idx, list, picks, checked } = quiz;
    if (settings.mode === "practice" && !checked[idx]) {
      if (picks[idx] < 0) return;
      checked[idx] = true;
      recordResult(list[idx], picks[idx] === list[idx].answer);
      renderQuestion();
      return;
    }
    if (idx === list.length - 1) { finish(); return; }
    quiz.idx++;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function recordResult(q, ok) {
    const has = saved.missed.indexOf(q.id);
    if (!ok && has < 0) saved.missed.push(q.id);
    if (ok && has >= 0) saved.missed.splice(has, 1);
    save();
  }

  // ---------- Results ----------
  function finish() {
    const { list, picks, checked } = quiz;
    const practice = settings.mode === "practice";
    // Practice mode only scores questions that were checked; exam mode scores everything shown.
    const scored = list.map((q, i) => ({ q, pick: picks[i], counted: practice ? checked[i] : true }))
      .filter((r) => r.counted);
    if (!practice) scored.forEach((r) => recordResult(r.q, r.pick === r.q.answer));

    const correct = scored.filter((r) => r.pick === r.q.answer).length;
    const total = scored.length;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const pass = pct >= PASS_MARK;
    const misses = scored.filter((r) => r.pick !== r.q.answer);

    const review = misses.map((r) => `
      <div class="review-item">
        <div class="tags"><span class="tag rule">${esc(r.q.rule)}</span><span class="tag">${esc(r.q.section.title)} · #${r.q.num}</span></div>
        <p>${esc(r.q.text)}</p>
        <p class="yours">Your answer: ${r.pick >= 0 ? `${LETTERS[r.pick]}. ${esc(r.q.choices[r.pick])}` : "not answered"}</p>
        <p class="correct">Correct: ${LETTERS[r.q.answer]}. ${esc(r.q.choices[r.q.answer])}</p>
        ${r.q.note ? `<p class="src">${esc(r.q.note)}</p>` : ""}
      </div>`).join("");

    app.innerHTML = `
      <section class="card" aria-labelledby="res-h">
        <h2 id="res-h">Results</h2>
        <div class="score">
          <div class="big ${pass ? "pass" : "fail"}">${pct}%</div>
          <div class="meta">
            <span><b>${correct}</b> of <b>${total}</b> correct</span>
            <span class="hint">${pass ? "That clears the 90% needed on the Coast Guard Rules of the Road exam." : "The Coast Guard Rules of the Road exam needs 90% to pass. Keep at it."}</span>
          </div>
        </div>
        <div class="actions">
          ${misses.length ? `<button class="btn primary" id="retry">Retake the ${misses.length} I missed</button>` : ""}
          <button class="btn ${misses.length ? "" : "primary"}" id="again">New test</button>
        </div>
      </section>
      ${misses.length ? `<section class="card"><h2>Review what you missed</h2><div class="review">${review}</div></section>` : ""}`;

    const retry = $("#retry");
    if (retry) retry.addEventListener("click", () => startQuiz(shuffle(misses.map((r) => r.q))));
    $("#again").addEventListener("click", renderSetup);
    quiz = null;
    window.scrollTo(0, 0);
  }

  // ---------- Keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (!quiz || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const li = LETTERS.indexOf(k);
    if (li >= 0 && li < 4) { choose(li); e.preventDefault(); return; }
    if (/^[1-4]$/.test(k)) { choose(Number(k) - 1); e.preventDefault(); return; }
    if (e.key === "Enter") {
      const next = $("#next");
      if (next && !next.disabled) { advance(); e.preventDefault(); }
    }
  });

  $("#total-count").textContent = bank.length;
  renderSetup();
})();
</script>
</body>
</html>
