  // ---------- Flash cards ----------
  // Every vessel in the Learn deck becomes a card. The front shows its lights (or day shapes);
  // tapping flips it to the name, what each light means and the saying.
  let flash = null;
  const FLASH_MODES = [
    ["ahead", "Night, from ahead"],
    ["mixed", "Night, any angle"],
    ["day", "Day shapes"],
  ];
  function flashSetup() {
    state = null; flash = null;
    let mode = "ahead";
    try { mode = localStorage.getItem(STORE + "-flash") || "ahead"; } catch (e) { /* storage unavailable */ }
    const count = (m) => VESSELS.filter((v) => (m === "day" ? !!v.day : true)).length;
    root.innerHTML = `
      <div class="actions"><button class="btn" id="g-home">Game menu</button></div>
      <section class="card">
        <h2>Flash cards</h2>
        <p>Look at the lights, say what it is, then tap the card to check. Mark each card <b>Got it</b> or <b>Study again</b>; the ones to study again come back until you know them all.</p>
        <div class="field">
          <span class="label">Show me</span>
          <div class="seg">${FLASH_MODES.map(([m, t]) => `<button type="button" data-fm="${m}" aria-pressed="${m === mode}">${t}</button>`).join("")}</div>
          <p class="hint" id="fm-hint">${count(mode)} cards</p>
        </div>
        <div class="actions"><button class="btn primary" id="f-start">Start flash cards</button></div>
      </section>`;
    root.querySelector("#g-home").addEventListener("click", home);
    root.querySelectorAll("[data-fm]").forEach((el) => el.addEventListener("click", () => {
      mode = el.dataset.fm;
      try { localStorage.setItem(STORE + "-flash", mode); } catch (e) { /* storage unavailable */ }
      root.querySelectorAll("[data-fm]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fm === mode)));
      root.querySelector("#fm-hint").textContent = count(mode) + " cards";
    }));
    root.querySelector("#f-start").addEventListener("click", () => flashStart(mode));
    window.scrollTo(0, 0);
  }
  function flashView(v, mode) {
    if (mode === "day") return "day";
    if (mode === "ahead") return lightsFor(v, "ahead").length ? "ahead" : "stbd";
    return pick(viewsFor(v).filter((w) => w !== "day"));
  }
  function flashStart(mode) {
    const deck = shuffle(VESSELS.filter((v) => (mode === "day" ? !!v.day : true)))
      .map((v) => ({ v, view: flashView(v, mode) }));
    flash = { mode, queue: deck, total: deck.length, known: 0, again: 0, flipped: false, firstTry: new Set(), seen: new Set() };
    flashCard();
  }
  function flashCard() {
    const f = flash;
    if (!f.queue.length) return flashDone();
    const { v, view } = f.queue[0];
    const angle = view === "day" ? "By day" : `At night, ${VIEWS[view].toLowerCase()}`;
    root.innerHTML = `
      <div class="progress">
        <div class="progress-row">
          <span class="label">${f.known} of ${f.total} known</span>
          <span class="label">${f.queue.length} left${f.again ? ` · ${f.again} to study again` : ""}</span>
        </div>
        <div class="bar"><div style="width:${(f.known / f.total) * 100}%"></div></div>
      </div>
      <button type="button" class="flashcard ${f.flipped ? "flipped" : ""}" id="f-card" aria-expanded="${f.flipped}"
        aria-label="${f.flipped ? esc(v.name) : "Flash card. Tap to reveal the answer"}">
        <span class="label">${esc(angle)}</span>
        <span class="scene-wrap">${picture(v, view, { aria: f.flipped ? v.name : "Mystery vessel" })}</span>
        ${f.flipped ? `
          <span class="flash-answer">
            <span class="flash-name">${esc(v.name)}${v.inland ? ` <span class="tag warn">Inland</span>` : ""}</span>
            ${dotRow(meanings(v, view))}
            <span class="trick"><span class="label">Remember</span> ${esc(v.say)}</span>
            ${vesselWhy(v, view, "span")}
            ${vesselMnemonic(v, view).replace(/<(\/?)(div|p)\b/g, "<$1span")}
          </span>` : `<span class="flash-prompt">What is it? Tap to reveal</span>`}
      </button>
      <div class="nav">
        <button class="btn ghost" id="f-quit">Stop</button>
        ${f.flipped ? `<div class="actions">
          <button class="btn" id="f-again">Study again</button>
          <button class="btn primary" id="f-got">Got it</button>
        </div>` : `<button class="btn primary" id="f-flip">Reveal answer</button>`}
      </div>
      <p class="kbd-hint">Keyboard: Space to flip, 1 = study again, 2 = got it.</p>`;
    root.querySelector("#f-card").addEventListener("click", flashFlip);
    root.querySelector("#f-quit").addEventListener("click", flashSetup);
    const fl = root.querySelector("#f-flip"); if (fl) fl.addEventListener("click", flashFlip);
    const ag = root.querySelector("#f-again"); if (ag) ag.addEventListener("click", () => flashMark(false));
    const go = root.querySelector("#f-got"); if (go) go.addEventListener("click", () => flashMark(true));
  }
  function flashFlip() { if (!flash) return; flash.flipped = !flash.flipped; flashCard(); }
  function flashMark(ok) {
    const f = flash;
    if (!f || !f.flipped) return;
    const c = f.queue.shift();
    if (ok) { f.known++; if (!f.seen.has(c.v.id)) f.firstTry.add(c.v.id); }
    else {
      if (!f.seen.has(c.v.id)) f.again++;
      // Bring it back a few cards later, from a fresh angle in "any angle" mode.
      const at = Math.min(f.queue.length, 3);
      f.queue.splice(at, 0, { v: c.v, view: f.mode === "mixed" ? flashView(c.v, "mixed") : c.view });
    }
    f.seen.add(c.v.id);
    f.flipped = false;
    flashCard();
    window.scrollTo(0, 0);
  }
  function flashDone() {
    const f = flash;
    const first = f.firstTry.size;
    root.innerHTML = `
      <section class="card">
        <h2>Deck done</h2>
        <div class="score">
          <div class="big ${first === f.total ? "pass" : "fail"}">${first}/${f.total}</div>
          <div class="meta">
            <span>Known on the first try.</span>
            <span class="hint">${f.again ? `${f.again} card${f.again === 1 ? "" : "s"} needed another look.` : "You knew every card the first time."}</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="f-restart">Shuffle and go again</button>
          <button class="btn" id="f-setup">Change cards</button>
          <button class="btn" id="g-play">Play 10 rounds</button>
        </div>
      </section>`;
    const mode = f.mode;
    flash = null;
    root.querySelector("#f-restart").addEventListener("click", () => flashStart(mode));
    root.querySelector("#f-setup").addEventListener("click", flashSetup);
    root.querySelector("#g-play").addEventListener("click", startGame);
    window.scrollTo(0, 0);
  }

  // ---------- Game ----------
  function makeRound() {
    for (let tries = 0; tries < 50; tries++) {
      const type = Math.random() < 0.65 ? "name" : "picture";
      const useDay = Math.random() < 0.3;
      const pool = VESSELS.filter((v) => (useDay ? !!v.day : true));
      const v = pick(pool);
      const views = viewsFor(v).filter((w) => (useDay ? w === "day" : w !== "day"));
      if (!views.length) continue;
      // From ahead and from the side tell you the most, so they come up most often.
      const weighted = views.flatMap((w) => (w === "astern" ? [w] : [w, w]));
      const view = pick(weighted);
      const sig = signature(v, view);
      const others = shuffle(VESSELS.filter((o) => o !== v && (view === "day" ? !!o.day : true)));
      const chosen = [];
      const seen = new Set([sig]);
      // Prefer look-alikes from the same group, so the choice actually teaches something.
      for (const o of [...others.filter((o) => o.group === v.group), ...others]) {
        if (chosen.length === 3) break;
        if (chosen.includes(o)) continue;
        if (view !== "day" && !lightsFor(o, view).length) continue;
        const s = signature(o, view);
        if (seen.has(s)) continue;
        seen.add(s);
        chosen.push(o);
      }
      if (chosen.length < 3) continue;
      const options = shuffle([v, ...chosen]);
      return { type, v, view, options, answer: options.indexOf(v) };
    }
    return null;
  }

  function startGame() {
    flash = null;
    const rounds = [];
    let lastId = null;
    while (rounds.length < 10) {
      const r = makeRound();
      if (r && r.v.id !== lastId) { rounds.push(r); lastId = r.v.id; }
    }
    state = { rounds, i: 0, picks: [], score: 0, streak: 0, bestStreak: 0, started: Date.now() };
    round();
  }

  function round() {
    const r = state.rounds[state.i];
    const picked = state.picks[state.i];
    const done = picked != null;
    const viewText = r.view === "day" ? "by day" : VIEWS[r.view].toLowerCase();
    let body;
    if (r.type === "name") {
      body = `
        <p class="question">You see this ${r.view === "day" ? "by day" : `at night, ${viewText}`}. What is it?</p>
        <div class="scene-wrap">${picture(r.v, r.view, { aria: "Mystery vessel" })}</div>
        <div class="choices">${r.options.map((o, i) => {
          let cls = "choice";
          if (done) { if (i === r.answer) cls += " right"; else if (i === picked) cls += " wrong"; }
          return `<button class="${cls}" data-g="${i}" ${done ? "disabled" : ""}><span class="key">${"ABCD"[i]}</span><span class="txt">${esc(o.name)}</span></button>`;
        }).join("")}${notSureBtn(done, picked)}</div>`;
    } else {
      body = `
        <p class="question">Which picture shows <b>${esc(r.v.name.toLowerCase())}</b>${r.view === "day" ? " by day" : `, ${viewText}`}?</p>
        <div class="pic-choices">${r.options.map((o, i) => {
          let cls = "pic-choice";
          if (done) { if (i === r.answer) cls += " right"; else if (i === picked) cls += " wrong"; }
          return `<button class="${cls}" data-g="${i}" ${done ? "disabled" : ""} aria-label="Picture ${"ABCD"[i]}">
            <span class="key">${"ABCD"[i]}</span>${picture(o, r.view, { aria: "Picture " + "ABCD"[i] })}
            ${done ? `<span class="pic-name">${esc(o.name)}</span>` : ""}</button>`;
        }).join("")}</div>
        <div class="choices">${notSureBtn(done, picked)}</div>`;
    }
    let feedback = "";
    if (done) {
      const ok = picked === r.answer;
      feedback = `<div class="feedback ${ok ? "right" : "wrong"}" role="status">
        <strong>${ok ? (state.streak >= 3 ? `Correct · ${state.streak} in a row` : "Correct") : picked === 9 ? "Not sure · marked incorrect" : "Not quite"}</strong>
        ${ok ? "" : `<p>That was <b>${esc(r.v.name)}</b>.</p>`}
        ${dotRow(meanings(r.v, r.view))}
        <p class="trick"><span class="label">Remember</span> ${esc(r.v.say)}</p>
        ${vesselWhy(r.v, r.view)}
        ${vesselMnemonic(r.v, r.view)}
      </div>`;
    }
    root.innerHTML = `
      <div class="progress">
        <div class="progress-row">
          <span class="label">Round ${state.i + 1} of 10</span>
          <span class="label">Score ${state.score}${state.streak >= 2 ? ` · streak ${state.streak}` : ""}</span>
        </div>
        <div class="bar"><div style="width:${((state.i + (done ? 1 : 0)) / 10) * 100}%"></div></div>
      </div>
      <section class="card game-card" aria-live="polite">
        ${body}
        ${feedback}
        <div class="nav">
          <button class="btn ghost" id="g-quit">Quit game</button>
          ${done ? `<button class="btn primary" id="g-next">${state.i === 9 ? "See score" : "Next round"}</button>` : ""}
        </div>
        <p class="kbd-hint">Keyboard: A–D or 1–4 to answer, N if not sure, Enter for the next round.</p>
      </section>`;
    root.querySelectorAll("[data-g]").forEach((el) => el.addEventListener("click", () => answer(Number(el.dataset.g))));
    root.querySelector("#g-quit").addEventListener("click", home);
    const nx = root.querySelector("#g-next");
    if (nx) { nx.addEventListener("click", nextRound); nx.focus({ preventScroll: true }); }
  }

  function notSureBtn(done, picked) {
    return `<button class="choice not-sure ${done && picked === 9 ? "wrong" : ""}" data-g="9" ${done ? "disabled" : ""}><span class="key">?</span><span class="txt">Not sure</span></button>`;
  }
  function answer(i) {
    if (!state || state.picks[state.i] != null) return;
    const r = state.rounds[state.i];
    state.picks[state.i] = i;
    if (i === r.answer) { state.score++; state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak); }
    else state.streak = 0;
    round();
  }
  function nextRound() {
    if (!state || state.picks[state.i] == null) return;
    if (state.i === 9) return results();
    state.i++;
    round();
    window.scrollTo(0, 0);
  }

  function results() {
    const secs = Math.round((Date.now() - state.started) / 1000);
    const best = loadBest();
    const newBest = best.score == null || state.score > best.score;
    saveBest({ score: Math.max(state.score, best.score ?? 0), streak: Math.max(state.bestStreak, best.streak || 0) });
    const missed = state.rounds.filter((r, i) => state.picks[i] !== r.answer);
    const msg = state.score === 10 ? "Perfect game. You know your lights." : state.score >= 8 ? "Strong. Review the misses below." : state.score >= 5 ? "Getting there. Study the misses, then play again." : "Keep going. The Learn cards will help.";
    root.innerHTML = `
      <section class="card">
        <h2>Game over</h2>
        <div class="score">
          <div class="big ${state.score >= 9 ? "pass" : "fail"}">${state.score}/10</div>
          <div class="meta">
            <span>${esc(msg)}</span>
            <span class="hint">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")} · longest streak ${state.bestStreak}${newBest && state.score > 0 ? " · new best!" : ""}</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="g-again">Play again</button>
          <button class="btn" id="g-learn">Learn the lights</button>
          <button class="btn" id="g-shapes">Learn the shapes</button>
          <button class="btn ghost" id="g-home">Game menu</button>
        </div>
      </section>
      ${missed.length ? `<section class="card"><h2>Study these</h2>
        <div class="vessel-grid">${missed.map((r) => `
          <button type="button" class="vessel-tile" data-open="${r.v.id}" data-view="${r.view}">
            ${picture(r.v, r.view, { aria: r.v.name })}
            <span class="vessel-name">${esc(r.v.name)}</span>
            <span class="vessel-say">${esc(r.v.say)}</span>
          </button>`).join("")}</div></section>` : ""}`;
    root.querySelector("#g-again").addEventListener("click", startGame);
    root.querySelector("#g-learn").addEventListener("click", () => learn());
    root.querySelector("#g-shapes").addEventListener("click", learnShapes);
    root.querySelector("#g-home").addEventListener("click", home);
    root.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => card(el.dataset.open, el.dataset.view)));
    state = null;
    window.scrollTo(0, 0);
  }

  function exit() { state = null; flash = null; root = null; if (onExit) onExit(); }

  document.addEventListener("keydown", (e) => {
    if (flash && root && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === " " || e.key === "Enter") {
        if (!flash.flipped) { flashFlip(); e.preventDefault(); }
        else if (e.key === "Enter") { flashMark(true); e.preventDefault(); }
        return;
      }
      if (e.key === "1") { flashMark(false); e.preventDefault(); return; }
      if (e.key === "2") { flashMark(true); e.preventDefault(); return; }
      return;
    }
    if (!state || !root || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const li = "ABCD".indexOf(k);
    if (li >= 0) { answer(li); e.preventDefault(); return; }
    if (k === "N" || k === "5") { answer(9); e.preventDefault(); return; }
    if (/^[1-4]$/.test(k)) { answer(Number(k) - 1); e.preventDefault(); return; }
    if (e.key === "Enter" && state.picks[state.i] != null) { nextRound(); e.preventDefault(); }
  });

  window.LightsGame = {
    open(container, back) { root = container; onExit = back; home(); },
    preview(id, view) { const v = byId.get(id); return v ? picture(v, view || "ahead", { aria: v.name }) : ""; },
    // Exposed for checks.
    _vessels: VESSELS, _lightsFor: lightsFor, _signature: signature, _makeRound: makeRound,
  };
})();
</script>
<script>
// Rules of the Road quiz — plain JavaScript, no dependencies.
// Question data comes from data/*.js via addSection() (defined in index.html before the data files load).

(function () {
  "use strict";

  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  const SUBJECTS = window.QUIZ_SUBJECTS;
  const NOT_SURE = 9; // the "Not sure" choice; always counts as wrong
  const STORE_KEY = "rotr-quiz-v1";

  // ---------- Build the question bank ----------
  const bank = [];
  for (const sec of window.QUIZ_SECTIONS) {
    sec.items = [];
    for (const row of sec.questions) {
      const [num, rule, text, choices, answer, flags = {}] = row;
      const q = {
        id: sec.id + "-" + num,
        section: sec,
        num, rule, text, choices,
        answer: LETTERS.indexOf(answer),
        diagram: !!flags.diagram,
        bookDiagram: flags.bookDiagram || "",
        diagrams: window.BookDiagrams ? window.BookDiagrams.numbersIn(text) : [],
        fromRules: flags.src === "rules",
        note: flags.note || "",
      };
      sec.items.push(q);
      bank.push(q);
    }
  }
  const byId = new Map(bank.map((q) => [q.id, q]));
  // A question can be asked if every diagram it mentions has been drawn.
  const drawable = (q) => q.diagrams.every((n) => window.BookDiagrams && window.BookDiagrams.has(n));
  function diagramFigure(q) {
    if (q.bookDiagram) return `<p class="missing-diagram">This question uses book diagram ${esc(q.bookDiagram)}, which isn't in the site yet. Send a photo of that diagram page and it will show here.</p>`;
    if (!q.diagrams.length || !window.BookDiagrams) return "";
    return `<div class="diagram-row">${q.diagrams.map((n) => `<figure class="diagram">
      ${window.BookDiagrams.render(n)}<figcaption>Diagram ${n}</figcaption></figure>`).join("")}</div>`;
  }

  // ---------- Saved settings + missed list (this browser only) ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch (e) { /* storage unavailable */ }
  }
  const saved = load();
  saved.missed = Array.isArray(saved.missed) ? saved.missed.filter((id) => byId.has(id)) : [];
  const settings = Object.assign(
    { subject: "rules", sections: window.QUIZ_SECTIONS.map((s) => s.id), mode: "practice", count: "25", shuffle: true, diagrams: false },
    saved.settings || {}
  );
  if (!SUBJECTS.some((x) => x.id === settings.subject)) settings.subject = "rules";
  // Sections added after the settings were saved start out switched on.
  const knownSections = new Set(saved.knownSections || window.QUIZ_SECTIONS.map((s) => s.id));
  for (const sec of window.QUIZ_SECTIONS) {
    if (!knownSections.has(sec.id) && !settings.sections.includes(sec.id)) settings.sections.push(sec.id);
  }
  saved.knownSections = window.QUIZ_SECTIONS.map((s) => s.id);
  saved.settings = settings;
  save();
  const subject = () => SUBJECTS.find((x) => x.id === settings.subject);
  const subjectSections = (id) => window.QUIZ_SECTIONS.filter((s) => s.subject === id);
  const subjectCount = (id) => bank.filter((q) => q.section.subject === id).length;
  const missedHere = () => saved.missed.filter((id) => byId.get(id).section.subject === settings.subject);

  // Last score per section (green 90%+, yellow 70-89%, red under 70%), from regular tests only.
  saved.sectionScores = saved.sectionScores && typeof saved.sectionScores === "object" ? saved.sectionScores : {};
  function grade(pct) { return pct >= 90 ? "good" : pct >= 70 ? "ok" : "bad"; }
  const GRADE_WORD = { good: "90% or more", ok: "70 to 89%", bad: "under 70%" };
  function gradeBadge(rec) {
    if (!rec || !rec.t) return `<span class="grade grade-none" title="You haven't taken a test on this section yet"><span class="dot" aria-hidden="true"></span>Not taken</span>`;
    if (rec.c === rec.t) return `<span class="grade grade-perfect" title="Perfect: ${rec.c} of ${rec.t}"><span class="star" aria-hidden="true">★</span>100%</span>`;
    const pct = Math.min(99, Math.round((rec.c / rec.t) * 100));
    const g = grade(pct);
    return `<span class="grade grade-${g}" title="Last score: ${rec.c} of ${rec.t} (${GRADE_WORD[g]})"><span class="dot" aria-hidden="true"></span>${pct}%</span>`;
  }

  // Last 3 scores per section (newest first), and last 3 whole tests per subject.
  saved.sectionHistory = saved.sectionHistory && typeof saved.sectionHistory === "object" ? saved.sectionHistory : {};
  for (const [id, rec] of Object.entries(saved.sectionScores)) {
    if (!saved.sectionHistory[id] && rec && rec.t) saved.sectionHistory[id] = [rec];
  }
  saved.testHistory = saved.testHistory && typeof saved.testHistory === "object" ? saved.testHistory : {};
  const pctOf = (r) => Math.round((r.c / r.t) * 100);
  function miniScore(rec) {
    const p = rec.c === rec.t ? 100 : Math.min(99, pctOf(rec));
    const g = p === 100 ? "perfect" : grade(p);
    return `<span class="mini mini-${g}" title="${rec.c} of ${rec.t}">${p === 100 ? "★" : ""}${p}%</span>`;
  }
  function historyBadges(id) {
    const hist = saved.sectionHistory[id] || [];
    if (!hist.length) return gradeBadge(null);
    const older = hist.slice(1, 3);
    return gradeBadge(hist[0]) + (older.length
      ? `<span class="prev" aria-label="Earlier scores">${older.map(miniScore).join("")}</span>` : "");
  }
  function trendWord(hist) {
    if (hist.length < 2) return "";
    const d = pctOf(hist[0]) - pctOf(hist[hist.length - 1]);
    return d > 0 ? `<span class="trend up">▲ up ${d} points</span>` : d < 0 ? `<span class="trend down">▼ down ${-d} points</span>` : `<span class="trend">steady</span>`;
  }
  function fmtDate(at) {
    if (!at) return "";
    try { return new Date(at).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch (e) { return ""; }
  }

  function updateHeader() {
    const sub = subject();
    const n = subjectCount(sub.id);
    $("#subject-title").textContent = sub.title;
    $("#subject-blurb").textContent = sub.blurb + (n ? ` · ${n} questions` : "");
    $("#source").textContent = sub.source;
  }

  // ---------- State ----------
  let quiz = null; // { list, idx, picks: [], checked: [] }

  const $ = (sel) => document.querySelector(sel);
  const app = $("#app");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pool() {
    return bank.filter((q) => q.section.subject === settings.subject && settings.sections.includes(q.section.id) && drawable(q));
  }

  // ---------- Tips ----------
  const TIPS = window.RULE_TIPS || {};
  // Which rules a question is about: the numbers in its "Rule" label, or a guess from its words
  // when the label has no number (the diagram pages only say BOTH / INLAND / INTERNATIONAL).
  const KEYWORD_RULES = [
    [/trawl|fishing|fish\b/i, "26"], [/tow|push|barge|alongside/i, "24"], [/pilot/i, "29"],
    [/anchor|aground/i, "30"], [/not under command|restricted|dredg|cable|mine|survey|navigation mark/i, "27"],
    [/sail/i, "25"], [/power-driven|underway/i, "23"],
  ];
  function rulesFor(q) {
    if (q.section.subject !== "rules") return [];
    const keys = [];
    const add = (k) => { if (TIPS[k] && !keys.includes(k)) keys.push(k); };
    for (const m of q.rule.matchAll(/Annex\s+([IV]+)/g)) add("Annex " + m[1]);
    for (const m of q.rule.replace(/\(.*?\)/g, "").matchAll(/\d+/g)) add(m[0]);
    if (!keys.length) {
      const words = q.text + " " + q.choices.join(" ");
      if (q.section.id === "sound-diagrams") {
        if (/fog/i.test(q.text)) add("35");
        else {
          if (/overtak/i.test(q.text)) add("13");
          if (/crossing/i.test(q.text)) add("15");
          if (/meeting/i.test(q.text)) add("14");
          add("34");
        }
      } else {
        for (const [re, k] of KEYWORD_RULES) if (re.test(words)) add(k);
      }
    }
    return keys.slice(0, 3);
  }
  // The "Remember" line after answering: the question's own tip, or the rule's saying if it has none.
  function rememberFor(q) {
    const own = (window.QUESTION_TIPS || {})[q.id];
    if (own) return own;
    const k = rulesFor(q)[0];
    return k ? TIPS[k].trick : "";
  }
  // The mnemonic device for the fact a question tests.
  function mnemonicFor(q) {
    const key = (window.QUESTION_MNEMONIC || {})[q.id];
    const m = key && (window.MNEMONICS || {})[key];
    return m ? { key, topic: m[0], device: m[1], meaning: m[2] } : null;
  }
  function whyLine(q) {
    const m = mnemonicFor(q);
    const why = m && (window.MNEMONIC_WHY || {})[m.key];
    return why ? `<p class="why"><span class="label">Why this rule exists</span> ${esc(why)}</p>` : "";
  }
  function mnemonicLine(q) {
    const m = mnemonicFor(q);
    if (!m) return "";
    return `<div class="mnemonic"><span class="label">Mnemonic · ${esc(m.topic)}</span>
      <p class="device">${esc(m.device)}</p><p class="meaning">${esc(m.meaning)}</p></div>`;
  }
  function tipCard(k) {
    const t = TIPS[k];
    const label = k.startsWith("Annex") ? k : "Rule " + k;
    return `<div class="tip-rule">
      <div class="tip-head"><span class="tag rule">${esc(label)}</span><strong>${esc(t.title)}</strong></div>
      <p>${esc(t.idea)}</p>
      <p class="trick"><span class="label">Remember</span> ${esc(t.trick)}</p>
    </div>`;
  }

  // ---------- Memory tricks page ----------
  function renderTricks() {
    quiz = null;
    setWide(false);
    const groups = (window.RULE_GROUPS || []).map((g) => `
      <section class="card">
        <h2>${esc(g.title)}</h2>
        <div class="trick-list">${g.keys.filter((k) => TIPS[k]).map((k) => `
          <details class="trick-item">
            <summary><span class="tag rule">${esc(k.startsWith("Annex") ? k : "Rule " + k)}</span>
              <span class="trick-title">${esc(TIPS[k].title)}</span>
              <span class="trick-line">${esc(TIPS[k].trick)}</span></summary>
            <p>${esc(TIPS[k].idea)}</p>
          </details>`).join("")}</div>
      </section>`).join("");
    const M = window.MNEMONICS || {};
    const devices = (window.MNEMONIC_GROUPS || []).map(([title, keys]) => `
      <section class="card">
        <h2>${esc(title)}</h2>
        <div class="trick-list">${keys.filter((k) => M[k]).map((k) => `
          <details class="trick-item">
            <summary><span class="trick-title">${esc(M[k][0])}</span>
              <span class="trick-line device">${esc(M[k][1])}</span></summary>
            <p>${esc(M[k][2])}</p>
            ${(window.MNEMONIC_WHY || {})[k] ? `<p class="why"><span class="label">Why</span> ${esc(window.MNEMONIC_WHY[k])}</p>` : ""}
          </details>`).join("")}</div>
      </section>`).join("");
    const count = (window.MNEMONIC_GROUPS || []).reduce((n, [, keys]) => n + keys.filter((k) => M[k]).length, 0);
    const tab = (window.__tricksTab = window.__tricksTab || "mnemonics");
    app.innerHTML = `
      <div class="actions"><button class="btn" id="back">Back to test setup</button></div>
      <section class="card">
        <h2>Memory tricks</h2>
        <div class="seg" role="group" aria-label="Show">
          <button type="button" data-tt="mnemonics" aria-pressed="${tab === "mnemonics"}">Mnemonics (${count})</button>
          <button type="button" data-tt="rules" aria-pressed="${tab === "rules"}">Rule by rule</button>
        </div>
        <p class="hint">${tab === "mnemonics" ? "A memory device for every fact the test asks about. Tap one to see what it unlocks. The same device appears after each question that tests it." : "One saying for each rule. Tap a rule to read what it says."}</p>
      </section>
      ${tab === "mnemonics" ? devices : groups}`;
    app.querySelectorAll("[data-tt]").forEach((el) => el.addEventListener("click", () => { window.__tricksTab = el.dataset.tt; renderTricks(); }));
    $("#back").addEventListener("click", renderSetup);
    window.scrollTo(0, 0);
  }

  // ---------- Setup screen ----------
  function renderSetup() {
    quiz = null;
    setWide(false);
    updateHeader();
    const sub = subject();
    const sections = subjectSections(sub.id);
    const subjectTabs = `<nav class="subjects" aria-label="Subject">${SUBJECTS.map((x) => {
      const n = subjectCount(x.id);
      return `<button type="button" class="subject" data-subject="${x.id}" aria-pressed="${x.id === sub.id}">
        <span class="subject-name">${esc(x.title)}</span>
        <span class="subject-count">${n ? n + " questions" : "Coming soon"}</span>
      </button>`;
    }).join("")}</nav>`;
    const gameCard = window.LightsGame ? `<section class="card game-promo">
        <div class="game-promo-pic" aria-hidden="true">${window.LightsGame.preview("nuc-way", "ahead")}</div>
        <div class="game-promo-text">
          <h2>Lights &amp; Shapes game</h2>
          <p class="hint">Learn which lights and day shapes belong to which boat, then play quick 10-round games.</p>
          <div class="actions"><button class="btn primary" id="open-game">Play the game</button></div>
        </div>
      </section>` : "";
    const secRows = sections.map((s) => {
      const n = s.items.filter(drawable).length;
      return `<label class="check" for="sec-${s.id}">
        <input type="checkbox" id="sec-${s.id}" data-sec="${s.id}" ${settings.sections.includes(s.id) ? "checked" : ""}>
        <span class="name">${esc(s.title)}${historyBadges(s.id)}</span>
        <span class="count">${n} q</span>
      </label>`;
    }).join("");

    const seg = (name, opts) => opts.map(([val, label]) =>
      `<button type="button" data-${name}="${val}" aria-pressed="${settings[name] === val}">${label}</button>`).join("");

    const available = pool().length;
    const missedCount = missedHere().length;
    const selectedHere = sections.filter((x) => settings.sections.includes(x.id)).length;
    const hasDiagrams = sections.some((s) => s.items.some((q) => q.diagram));

    if (!sections.length) {
      app.innerHTML = `${subjectTabs}${gameCard}
        <section class="card empty">
          <h2>No ${esc(sub.title)} questions yet</h2>
          <p>Send photos of your ${esc(sub.title)} practice pages and their answer key, and the questions will show up here with the same practice mode, exam mode, tips and missed-question retakes.</p>
          <p class="hint">Passing score for this exam module: ${sub.pass}%.</p>
        </section>`;
      bindSubjectTabs();
      bindGame();
      return;
    }

    const tests = saved.testHistory[sub.id] || [];
    const recent = tests.length ? `<div class="recent">
        <div class="field-head"><span class="label">Last ${tests.length === 1 ? "test" : tests.length + " tests"}</span>${trendWord(tests)}</div>
        <div class="recent-list">${tests.map((r, i) => `
          <div class="recent-item">
            ${gradeBadge(r)}
            <span class="recent-meta">${r.c} of ${r.t}${r.mode === "exam" ? " · exam" : " · practice"}${fmtDate(r.at) ? " · " + fmtDate(r.at) : ""}</span>
            ${i === 0 ? `<span class="tag">latest</span>` : ""}
          </div>`).join("")}</div>
      </div>` : "";

    app.innerHTML = `${subjectTabs}${gameCard}
      <section class="card" aria-labelledby="setup-h">
        <h2 id="setup-h">Build your test</h2>
        <div class="field">
          <div class="field-head">
            <span class="label">Sections · ${selectedHere} of ${sections.length} selected</span>
            ${`<div class="legend" aria-label="Score colors">
              <span class="label">Score colors</span>
              <span class="grade grade-perfect"><span class="star" aria-hidden="true">★</span>100%</span>
              <span class="grade grade-good"><span class="dot" aria-hidden="true"></span>90%+</span>
              <span class="grade grade-ok"><span class="dot" aria-hidden="true"></span>70–89%</span>
              <span class="grade grade-bad"><span class="dot" aria-hidden="true"></span>under 70%</span>
              <span class="grade grade-none"><span class="dot" aria-hidden="true"></span>Not taken</span>
            </div>`}
            <div class="mini-actions">
              <button type="button" class="link-btn" id="sel-all" ${selectedHere === sections.length ? "disabled" : ""}>Select all</button>
              <button type="button" class="link-btn" id="sel-none" ${selectedHere === 0 ? "disabled" : ""}>Deselect all</button>
            </div>
          </div>
          <div class="sections">${secRows}</div>
        </div>
        <div class="options">
          <div class="field">
            <span class="label">Mode</span>
            <div class="seg">${seg("mode", [["practice", "Practice"], ["exam", "Exam"]])}</div>
            <p class="hint">${settings.mode === "practice" ? "See the answer after each question." : "Answers are revealed at the end."}</p>
          </div>
          <div class="field">
            <span class="label">Questions</span>
            <div class="seg">${seg("count", [["10", "10"], ["25", "25"], ["50", "50"], ["all", "All"]])}</div>
            <p class="hint">${available} available with these settings.</p>
          </div>
        </div>
        <div class="field">
          <label class="toggle" for="opt-shuffle"><input type="checkbox" id="opt-shuffle" ${settings.shuffle ? "checked" : ""}> Shuffle question order</label>
          ${hasDiagrams ? `<p class="hint">Questions that refer to a book diagram show the diagram with the question.</p>` : ""}
        </div>
        <div class="actions">
          <button class="btn primary" id="start" ${available ? "" : "disabled"}>Start test</button>
          <button class="btn" id="start-missed" ${missedCount ? "" : "disabled"}>Retake missed (${missedCount})</button>
          ${missedCount ? `<button class="btn ghost" id="clear-missed">Clear missed list</button>` : ""}
        </div>
      </section>
      ${sub.id === "rules" ? `<section class="card tricks-promo">
        <div>
          <h2>Memory tricks</h2>
          <p class="hint">Mnemonics for every fact on the test, like "Nobody Really Cares For Sailing Power Planes."</p>
        </div>
        <button class="btn" id="open-tricks">Open memory tricks</button>
      </section>` : ""}`;
    bindSubjectTabs();
    bindGame();

    app.querySelectorAll("[data-sec]").forEach((el) => el.addEventListener("change", () => {
      const others = settings.sections.filter((id) => !sections.some((x) => x.id === id));
      settings.sections = [...others, ...[...app.querySelectorAll("[data-sec]:checked")].map((x) => x.dataset.sec)];
      persistSettings(); renderSetup();
    }));
    const hereIds = sections.map((x) => x.id);
    $("#sel-all").addEventListener("click", () => {
      settings.sections = [...new Set([...settings.sections, ...hereIds])];
      persistSettings(); renderSetup();
    });
    $("#sel-none").addEventListener("click", () => {
      settings.sections = settings.sections.filter((id) => !hereIds.includes(id));
      persistSettings(); renderSetup();
    });
    app.querySelectorAll("[data-mode]").forEach((el) => el.addEventListener("click", () => {
      settings.mode = el.dataset.mode; persistSettings(); renderSetup();
    }));
    app.querySelectorAll("[data-count]").forEach((el) => el.addEventListener("click", () => {
      settings.count = el.dataset.count; persistSettings(); renderSetup();
    }));
    $("#opt-shuffle").addEventListener("change", (e) => { settings.shuffle = e.target.checked; persistSettings(); });
    $("#start").addEventListener("click", () => {
      let list = pool();
      if (settings.shuffle) list = shuffle(list);
      if (settings.count !== "all") list = list.slice(0, Number(settings.count));
      startQuiz(list, "test");
    });
    $("#start-missed").addEventListener("click", () => {
      startQuiz(shuffle(missedHere().map((id) => byId.get(id))));
    });
    const tricks = $("#open-tricks");
    if (tricks) tricks.addEventListener("click", renderTricks);
    const clr = $("#clear-missed");
    if (clr) clr.addEventListener("click", () => {
      const here = new Set(missedHere());
      saved.missed = saved.missed.filter((id) => !here.has(id));
      save(); renderSetup();
    });
  }
  function bindGame() {
    const g = $("#open-game");
    if (g) g.addEventListener("click", () => { setWide(false); window.LightsGame.open(app, renderSetup); });
  }
  function bindSubjectTabs() {
    app.querySelectorAll("[data-subject]").forEach((el) => el.addEventListener("click", () => {
      settings.subject = el.dataset.subject; persistSettings(); renderSetup();
    }));
  }
  function persistSettings() { saved.settings = settings; save(); }

  // ---------- Quiz screen ----------
  function startQuiz(list, kind = "retake") {
    quiz = {
      list, idx: 0, kind,
      picks: new Array(list.length).fill(-1),
      checked: new Array(list.length).fill(false),
      tips: new Array(list.length).fill(false),
      struck: list.map(() => []),
      firstPick: new Array(list.length).fill(-1), // practice: the answer given the first time it was checked
      retried: new Array(list.length).fill(false),
      furthest: 0,                                 // practice: the furthest question reached
    };
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    const { list, idx, picks, checked, tips, struck } = quiz;
    const q = list[idx];
    const ruleKeys = rulesFor(q);
    const practice = settings.mode === "practice";
    const pick = picks[idx];
    const done = practice && checked[idx];
    const answeredCount = picks.filter((p) => p >= 0).length;
    // Practice: returnTo is set by "Try again" so you can jump back to where you were.
    const returning = practice && quiz.returnTo != null && quiz.returnTo !== idx;
    const revisiting = practice && idx < quiz.furthest;

    const choices = q.choices.map((c, i) => {
      let cls = "choice";
      if (done) {
        if (i === q.answer) cls += " right";
        else if (i === pick) cls += " wrong";
      } else if (i === pick) cls += " selected";
      const out = struck[idx].includes(i);
      if (out) cls += " struck";
      return `<button class="${cls}" data-choice="${i}" ${done || out ? "disabled" : ""} ${out ? 'aria-label="Crossed out: ' + esc(c) + '"' : ""}>
        <span class="key">${LETTERS[i]}</span><span class="txt">${esc(c)}</span></button>`;
    }).join("") + (() => {
      let cls = "choice not-sure";
      if (done && pick === NOT_SURE) cls += " wrong";
      else if (!done && pick === NOT_SURE) cls += " selected";
      return `<button class="${cls}" data-choice="${NOT_SURE}" ${done ? "disabled" : ""}>
        <span class="key">?</span><span class="txt">Not sure</span></button>`;
    })();

    let feedback = "";
    if (done) {
      const ok = pick === q.answer;
      feedback = `<div class="feedback ${ok ? "right" : "wrong"}" role="status">
        <strong>${ok ? "Correct" : pick === NOT_SURE ? "Not sure · marked incorrect" : "Incorrect"}</strong>
        ${ok ? "" : `<p>The answer is <b>${LETTERS[q.answer]}</b>: ${esc(q.choices[q.answer])}</p>`}
        ${q.note ? `<p>${esc(q.note)}</p>` : ""}
        ${rememberFor(q) ? `<p class="trick"><span class="label">Remember</span> ${esc(rememberFor(q))}</p>` : ""}
        ${whyLine(q)}
        ${mnemonicLine(q)}
        <p class="src">${q.fromRules ? (q.section.subject === "rules" ? "Answer worked out from the Navigation Rules (book key not yet added)." : "Answer worked out from standard deck references (book key not yet added).") : "Answer from the book's answer key."}${quiz.retried[idx] ? " Retries don't change your score; your first answer counts." : ""}</p>
      </div>`;
    }

    let tipPanel = "";
    if (tips[idx] && !done) {
      const wrongLeft = q.choices.map((_, i) => i).filter((i) => i !== q.answer && !struck[idx].includes(i));
      const canStrike = struck[idx].length < 2 && wrongLeft.length > 0;
      tipPanel = `<div class="tip-box" role="note">
        ${ruleKeys.length ? ruleKeys.map(tipCard).join("") : `<p>Read each answer and rule out the ones that can't be true. Watch for words like ALL, NEVER and EXCEPT.</p>`}
        <div class="actions">
          <button class="btn" id="strike" ${canStrike ? "" : "disabled"}>${struck[idx].length ? "Cross out another wrong answer" : "Cross out a wrong answer"}</button>
        </div>
      </div>`;
    }

    const last = idx === list.length - 1;
    let nextLabel, nextDisabled;
    if (practice) {
      nextLabel = done ? (returning ? `Back to question ${quiz.returnTo + 1}` : last ? "See results" : "Next question") : "Check answer";
      nextDisabled = pick < 0;
    } else {
      nextLabel = last ? "Finish test" : "Next question";
      nextDisabled = false;
    }

    const reached = practice ? quiz.furthest + (checked[quiz.furthest] ? 1 : 0) : idx + (done ? 1 : 0);
    const main = `
      <div class="progress">
        <div class="progress-row">
          <span class="label">Question ${idx + 1} of ${list.length}${practice && quiz.retried[idx] && !done ? " · trying again" : revisiting ? " · reviewing" : ""}</span>
          <span class="label">${practice ? "Practice" : `${answeredCount} answered`}</span>
        </div>
        <div class="bar"><div style="width:${(reached / list.length) * 100}%"></div></div>
      </div>
      <section class="card" aria-live="polite">
        <div class="tags">
          <span class="tag rule">${esc(q.rule)}</span>
          <span class="tag">${esc(q.section.title)} · #${q.num}</span>

        </div>
        <p class="question">${esc(q.text)}</p>
        ${diagramFigure(q)}
        <div class="choices">${choices}</div>
        ${tipPanel}
        ${feedback}
        <div class="nav">
          <div class="actions">
            ${idx > 0 ? `<button class="btn" id="prev" aria-label="Previous question">← Back</button>` : ""}
            ${returning && !done ? `<button class="btn" id="resume">Skip, back to question ${quiz.returnTo + 1}</button>` : ""}
            ${done ? "" : `<button class="btn tip-btn" id="tip" aria-expanded="${tips[idx]}">${tips[idx] ? "Hide tip" : "Tip"}</button>`}
            <button class="btn ghost" id="quit">End test</button>
          </div>
          <button class="btn primary" id="next" ${nextDisabled ? "disabled" : ""}>${nextLabel}</button>
        </div>
        <p class="kbd-hint">Keyboard: press A–D or 1–4 to choose, N if not sure, T for a tip, Enter to continue, ← to go back.</p>
      </section>`;

    setWide(practice);
    app.innerHTML = practice
      ? `<div class="quiz-layout"><div class="quiz-main">${main}</div>${missedPanel()}</div>`
      : main;

    app.querySelectorAll("[data-choice]").forEach((el) =>
      el.addEventListener("click", () => choose(Number(el.dataset.choice))));
    $("#next").addEventListener("click", advance);
    $("#quit").addEventListener("click", finish);
    const tipBtn = $("#tip");
    if (tipBtn) tipBtn.addEventListener("click", toggleTip);
    const strikeBtn = $("#strike");
    if (strikeBtn) strikeBtn.addEventListener("click", strikeOne);
    const prev = $("#prev");
    if (prev) prev.addEventListener("click", goBack);
    const resume = $("#resume");
    if (resume) resume.addEventListener("click", () => { quiz.idx = quiz.returnTo; quiz.returnTo = null; renderQuestion(); });
    app.querySelectorAll("[data-retry]").forEach((el) =>
      el.addEventListener("click", () => tryAgain(Number(el.dataset.retry))));
  }

  // Practice mode: the questions missed so far in this test, with a way back to each one.
  function missedPanel() {
    const { list, firstPick, picks, checked, retried, idx } = quiz;
    const rows = [];
    list.forEach((q, i) => {
      if (firstPick[i] < 0 || firstPick[i] === q.answer) return;
      let status, cls;
      if (i === idx && !checked[i]) { status = "Trying again now"; cls = "now"; }
      else if (retried[i] && checked[i] && picks[i] === q.answer) { status = "Got it on retry"; cls = "fixed"; }
      else if (retried[i] && checked[i]) { status = "Missed again"; cls = "missed"; }
      else { status = "Missed"; cls = "missed"; }
      const canRetry = !(i === idx && !checked[i]);
      rows.push(`<li class="missed-item ${cls}">
        <div class="missed-top"><span class="missed-num">Q${i + 1}</span><span class="missed-status">${status}</span></div>
        <p class="missed-text">${esc(q.text.length > 90 ? q.text.slice(0, 88).trimEnd() + "…" : q.text)}</p>
        ${canRetry ? `<button type="button" class="link-btn" data-retry="${i}">Try again</button>` : ""}
      </li>`);
    });
    const fixed = rows.filter((r) => r.includes("missed-item fixed")).length;
    return `<aside class="missed-panel" aria-labelledby="missed-h">
      <div class="missed-head">
        <h2 id="missed-h">Missed this test</h2>
        <span class="count">${rows.length}${fixed ? ` · ${fixed} fixed` : ""}</span>
      </div>
      ${rows.length ? `<ol class="missed-list">${rows.join("")}</ol>` : `<p class="hint">Nothing missed yet. Questions you get wrong show up here so you can go back and try them again.</p>`}
    </aside>`;
  }

  function goBack() {
    if (!quiz || quiz.idx === 0) return;
    quiz.idx--;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function tryAgain(i) {
    if (!quiz) return;
    if (quiz.returnTo == null) quiz.returnTo = quiz.idx;
    quiz.idx = i;
    quiz.picks[i] = -1;
    quiz.checked[i] = false;
    quiz.struck[i] = [];
    quiz.tips[i] = false;
    quiz.retried[i] = true;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function setWide(on) {
    const wrap = document.querySelector(".wrap");
    if (wrap) wrap.classList.toggle("wide", !!on);
  }

  function toggleTip() {
    if (!quiz) return;
    const { idx, checked } = quiz;
    if (settings.mode === "practice" && checked[idx]) return;
    quiz.tips[idx] = !quiz.tips[idx];
    if (quiz.tips[idx]) quiz.usedTip = (quiz.usedTip || new Set()).add(idx);
    renderQuestion();
  }

  function strikeOne() {
    if (!quiz) return;
    const { idx, list, struck, picks } = quiz;
    const q = list[idx];
    if (struck[idx].length >= 2) return;
    const options = q.choices.map((_, i) => i).filter((i) => i !== q.answer && !struck[idx].includes(i));
    if (!options.length) return;
    const pickOut = options[Math.floor(Math.random() * options.length)];
    struck[idx].push(pickOut);
    if (picks[idx] === pickOut) picks[idx] = -1;
    renderQuestion();
  }

  function choose(i) {
    if (!quiz) return;
    const { idx, checked } = quiz;
    if (settings.mode === "practice" && checked[idx]) return;
    if (i >= quiz.list[idx].choices.length && i !== NOT_SURE) return;
    if (quiz.struck[idx].includes(i)) return;
    quiz.picks[idx] = i;
    renderQuestion();
  }

  function advance() {
    if (!quiz) return;
    const { idx, list, picks, checked } = quiz;
    if (settings.mode === "practice" && !checked[idx]) {
      if (picks[idx] < 0) return;
      checked[idx] = true;
      if (quiz.firstPick[idx] < 0) {
        quiz.firstPick[idx] = picks[idx];
        recordResult(list[idx], picks[idx] === list[idx].answer);
      }
      renderQuestion();
      return;
    }
    if (settings.mode === "practice" && quiz.returnTo != null && quiz.returnTo !== idx) {
      quiz.idx = quiz.returnTo;
      quiz.returnTo = null;
      renderQuestion();
      window.scrollTo(0, 0);
      return;
    }
    if (settings.mode === "practice" && idx < quiz.furthest) {
      quiz.idx = idx + 1;
      renderQuestion();
      window.scrollTo(0, 0);
      return;
    }
    if (idx === list.length - 1) { finish(); return; }
    quiz.idx++;
    if (settings.mode === "practice") quiz.furthest = Math.max(quiz.furthest, quiz.idx);
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function recordResult(q, ok) {
    const has = saved.missed.indexOf(q.id);
    if (!ok && has < 0) saved.missed.push(q.id);
    if (ok && has >= 0) saved.missed.splice(has, 1);
    save();
  }

  // ---------- Results ----------
  function finish() {
    const { list, picks, checked } = quiz;
    const tipsUsed = quiz.usedTip ? quiz.usedTip.size : 0;
    setWide(false);
    const practice = settings.mode === "practice";
    // Practice mode only scores questions that were checked; exam mode scores everything shown.
    const scored = list.map((q, i) => practice
        ? { q, pick: quiz.firstPick[i], counted: quiz.firstPick[i] >= 0 }
        : { q, pick: picks[i], counted: true })
      .filter((r) => r.counted);
    if (!practice) scored.forEach((r) => recordResult(r.q, r.pick === r.q.answer));

    const correct = scored.filter((r) => r.pick === r.q.answer).length;
    const total = scored.length;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const sub = subject();
    const pass = pct >= sub.pass;
    const misses = scored.filter((r) => r.pick !== r.q.answer);

    // Score each section that had questions in this test.
    const bySection = new Map();
    for (const r of scored) {
      const rec = bySection.get(r.q.section) || { c: 0, t: 0 };
      rec.t++; if (r.pick === r.q.answer) rec.c++;
      bySection.set(r.q.section, rec);
    }
    const recorded = quiz.kind === "test";
    if (recorded) {
      const at = Date.now();
      for (const [sec, rec] of bySection) {
        const entry = { c: rec.c, t: rec.t, at };
        saved.sectionScores[sec.id] = entry;
        saved.sectionHistory[sec.id] = [entry, ...(saved.sectionHistory[sec.id] || [])].slice(0, 3);
      }
      if (total) saved.testHistory[sub.id] = [{ c: correct, t: total, at, mode: settings.mode }, ...(saved.testHistory[sub.id] || [])].slice(0, 3);
      save();
    }
    const sectionRows = [...bySection].map(([sec, rec]) => `
      <div class="sec-score"><span class="name">${esc(sec.title)}</span>${recorded ? historyBadges(sec.id) : gradeBadge(rec)}<span class="count">${rec.c} of ${rec.t}</span></div>`).join("");

    const review = misses.map((r) => `
      <div class="review-item">
        <div class="tags"><span class="tag rule">${esc(r.q.rule)}</span><span class="tag">${esc(r.q.section.title)} · #${r.q.num}</span></div>
        <p>${esc(r.q.text)}</p>
        ${diagramFigure(r.q)}
        <p class="yours">Your answer: ${r.pick === NOT_SURE ? "Not sure" : r.pick >= 0 ? `${LETTERS[r.pick]}. ${esc(r.q.choices[r.pick])}` : "not answered"}</p>
        <p class="correct">Correct: ${LETTERS[r.q.answer]}. ${esc(r.q.choices[r.q.answer])}</p>
        ${r.q.note ? `<p class="src">${esc(r.q.note)}</p>` : ""}
        ${rememberFor(r.q) ? `<p class="trick"><span class="label">Remember</span> ${esc(rememberFor(r.q))}</p>` : ""}
        ${whyLine(r.q)}
        ${mnemonicLine(r.q)}
      </div>`).join("");

    app.innerHTML = `
      <section class="card" aria-labelledby="res-h">
        <h2 id="res-h">Results</h2>
        <div class="score">
          <div class="big ${pass ? "pass" : "fail"}">${pct}%</div>
          <div class="meta">
            <span><b>${correct}</b> of <b>${total}</b> correct${tipsUsed ? ` · tips used on ${tipsUsed}` : ""}</span>
            <span class="hint">${pass ? `That clears the ${sub.pass}% needed on the Coast Guard ${esc(sub.title)} exam.` : `The Coast Guard ${esc(sub.title)} exam needs ${sub.pass}% to pass. Keep at it.`}</span>
          </div>
        </div>
        <div class="actions">
          ${misses.length ? `<button class="btn primary" id="retry">Retake the ${misses.length} I missed</button>` : ""}
          <button class="btn ${misses.length ? "" : "primary"}" id="again">New test</button>
        </div>
      </section>
      ${bySection.size ? `<section class="card"><h2>By section</h2>
        <div class="sec-scores">${sectionRows}</div>
        <p class="hint">${recorded ? "These colors now show next to each section when you build a test." : "Retakes of missed questions don't change the section colors; only regular tests do."}</p>
      </section>` : ""}
      ${misses.length ? `<section class="card"><h2>Review what you missed</h2><div class="review">${review}</div></section>` : ""}`;

    const retry = $("#retry");
    if (retry) retry.addEventListener("click", () => startQuiz(shuffle(misses.map((r) => r.q))));
    $("#again").addEventListener("click", renderSetup);
    quiz = null;
    window.scrollTo(0, 0);
  }

  // ---------- Keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (!quiz || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const li = LETTERS.indexOf(k);
    if (li >= 0 && li < 4) { choose(li); e.preventDefault(); return; }
    if (k === "N" || k === "5") { choose(NOT_SURE); e.preventDefault(); return; }
    if (/^[1-4]$/.test(k)) { choose(Number(k) - 1); e.preventDefault(); return; }
    if (k === "T") { toggleTip(); e.preventDefault(); return; }
    if (e.key === "ArrowLeft") { goBack(); e.preventDefault(); return; }
    if (e.key === "ArrowRight") {
      const next = $("#next");
      if (next && !next.disabled && (settings.mode === "exam" || quiz.checked[quiz.idx])) { advance(); e.preventDefault(); }
      return;
    }
    if (e.key === "Enter") {
      const next = $("#next");
      if (next && !next.disabled) { advance(); e.preventDefault(); }
    }
  });

  renderSetup();
})();
</script>
</body>
</html>
