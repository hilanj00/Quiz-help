<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deck Exam Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one centered column, like a single card on a chart table. Port red = wrong, starboard green = right. */
:root {
  --diagram-bg: #ffffff;
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #102a3c;
  --muted: #557083;
  --line: #d3dde4;
  --accent: #1d5f8c;
  --accent-ink: #ffffff;
  --port: #c2332b;
  --port-soft: #fbe9e7;
  --stbd: #1e8a4c;
  --stbd-soft: #e5f4ea;
  --amber: #b4770f;
  --amber-soft: #fbf1dc;
  --gold: #9a6a00;
  --gold-soft: #fff1c2;
  --gold-star: #f2b705;
  --gold-hi: #ffe27a;
  --gold-ink: #3d2a00;
  --grey-soft: #e8edf1;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1721; --surface: #12222f; --ink: #e3edf3; --muted: #93abbb; --line: #24394a;
    --accent: #5ba7da; --accent-ink: #06121b;
    --port: #ef6b62; --port-soft: #3a1c1b; --stbd: #4cc27f; --stbd-soft: #15301f;
    --amber: #e3a841; --amber-soft: #33270f; --diagram-bg: #12222f;
    --gold: #f2c94c; --gold-soft: #3a2f0c; --gold-star: #f2b705; --gold-hi: #ffe27a; --gold-ink: #2b1d00; --grey-soft: #1b2d3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1721; --surface: #12222f; --ink: #e3edf3; --muted: #93abbb; --line: #24394a;
  --accent: #5ba7da; --accent-ink: #06121b;
  --port: #ef6b62; --port-soft: #3a1c1b; --stbd: #4cc27f; --stbd-soft: #15301f;
  --amber: #e3a841; --amber-soft: #33270f; --diagram-bg: #12222f;
  --gold: #f2c94c; --gold-soft: #3a2f0c; --gold-star: #f2b705; --gold-hi: #ffe27a; --gold-ink: #2b1d00; --grey-soft: #1b2d3b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

#app { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.1rem;
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.lights { display: flex; gap: 6px; align-items: center; }
.lights span { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights .r { background: var(--port); }
.lights .w { background: var(--surface); border: 2px solid var(--muted); }
.lights .g { background: var(--stbd); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.35rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-wrap: balance;
}
.label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Subject tabs */
.subjects { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.subject {
  font: inherit; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 12px; min-width: 0;
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 8px;
}
.subject:hover { border-color: var(--accent); }
.subject[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.subject-name { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.02em; }
.subject-count { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.8; }
.subject:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card.empty p { margin: 0; }
@media (max-width: 640px) { .subjects { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Score colors */
.grade {
  display: inline-flex; align-items: center; gap: 5px;
  margin-left: 8px; padding: 1px 8px 1px 6px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
  font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: 1px;
  border: 1px solid currentColor;
}
.grade .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.grade-good { color: var(--stbd); background: var(--stbd-soft); }
.grade-ok { color: var(--amber); background: var(--amber-soft); }
.grade-bad { color: var(--port); background: var(--port-soft); }
.grade-perfect {
  color: var(--gold-ink); border-color: var(--gold);
  background: linear-gradient(180deg, var(--gold-hi), var(--gold-star));
  padding-left: 5px; box-shadow: 0 0 0 2px var(--gold-soft);
}
.grade-perfect .star { color: var(--gold-ink); font-size: 0.95rem; line-height: 1; }
.grade-none { color: var(--muted); background: var(--grey-soft); border-color: var(--line); font-weight: 500; }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; }
.legend .grade { margin-left: 0; }
.sec-scores { display: flex; flex-direction: column; gap: 6px; }
.sec-score { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sec-score:last-child { border-bottom: 0; }
.sec-score .name { flex: 1; min-width: 0; }
.sec-score .grade { margin-left: 0; }
.sec-score .count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

/* Score history */
.prev { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.mini {
  font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 0 5px; border-radius: 999px; border: 1px solid currentColor; opacity: 0.75; white-space: nowrap;
}
.mini-good { color: var(--stbd); }
.mini-ok { color: var(--amber); }
.mini-bad { color: var(--port); }
.mini-perfect { color: var(--gold); border-color: var(--gold-star); }
.recent { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: var(--bg); }
.recent-list { display: flex; flex-direction: column; gap: 6px; }
.recent-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.recent-item .grade { margin-left: 0; min-width: 64px; justify-content: center; }
.recent-meta { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.trend { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.trend.up { color: var(--stbd); }
.trend.down { color: var(--port); }

/* Setup */
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.mini-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.link-btn {
  font: inherit; font-size: 0.85rem; font-weight: 600;
  padding: 5px 10px; border-radius: 6px; cursor: pointer;
  background: transparent; color: var(--accent); border: 1px solid var(--accent);
}
.link-btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.link-btn:disabled { opacity: 0.4; cursor: default; }
.link-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sections { display: flex; flex-direction: column; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
}
.check:hover { border-color: var(--accent); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check .name { flex: 1; min-width: 0; }
.check .count { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--ink);
  padding: 8px 6px; font: inherit; font-size: 0.9rem; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { margin: 0; color: var(--muted); font-size: 0.85rem; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600;
  padding: 11px 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.25s ease; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em;
  padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--line); color: var(--muted);
}
.tag.rule { color: var(--accent); border-color: var(--accent); }
.tag.warn { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.question { font-size: 1.15rem; line-height: 1.45; margin: 0; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  width: 100%;
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .key {
  flex: none; width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem;
  border: 1.5px solid var(--line);
}
.choice .txt { flex: 1; min-width: 0; padding-top: 2px; }
.choice.selected { border-color: var(--accent); }
.choice.selected .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice.right { border-color: var(--stbd); background: var(--stbd-soft); }
.choice.right .key { background: var(--stbd); border-color: var(--stbd); color: #fff; }
.choice.wrong { border-color: var(--port); background: var(--port-soft); }
.choice.wrong .key { background: var(--port); border-color: var(--port); color: #fff; }
.choice:disabled { cursor: default; }

.feedback { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.feedback.right { background: var(--stbd-soft); border-left: 4px solid var(--stbd); }
.feedback.wrong { background: var(--port-soft); border-left: 4px solid var(--port); }
.feedback strong { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.03em; text-transform: uppercase; }
.feedback p { margin: 0; }
.src { color: var(--muted); font-size: 0.85rem; }

/* Practice layout: question on the left, missed list on the right */
.wrap.wide { max-width: 1060px; }
.quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.quiz-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.missed-panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
  max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--port);
  border-radius: 10px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.missed-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.missed-head h2 { font-size: 1.15rem; }
.missed-head .count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.missed-panel .hint { margin: 0; }
.missed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.missed-item {
  border: 1px solid var(--line); border-left: 4px solid var(--port); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.missed-item.fixed { border-left-color: var(--stbd); }
.missed-item.now { border-left-color: var(--accent); background: var(--bg); }
.missed-top { display: flex; gap: 8px; align-items: baseline; width: 100%; }
.missed-num { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; }
.missed-status { font-size: 0.8rem; color: var(--port); font-weight: 600; }
.missed-item.fixed .missed-status { color: var(--stbd); }
.missed-item.now .missed-status { color: var(--accent); }
.missed-text { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.4; }
@media (max-width: 860px) {
  .quiz-layout { grid-template-columns: minmax(0, 1fr); }
  .missed-panel { position: static; max-height: none; }
}

/* Lights & Shapes game */
.scene { display: block; width: 100%; height: auto; border-radius: 8px; }
.scene .svg-label, .scene .svg-tag { font: 600 11px var(--font-mono); fill: #9bb3c6; }
.scene.day .svg-tag { fill: #1b2a36; }
.scene .flashing { animation: lamp-flash 0.9s steps(2, jump-none) infinite; }
@keyframes lamp-flash { 0% { opacity: 1; } 100% { opacity: 0.15; } }
@media (prefers-reduced-motion: reduce) { .scene .flashing { animation: none; } }
.scene-wrap { max-width: 520px; width: 100%; align-self: center; }
.game-promo { flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 4px solid var(--stbd); }
.game-promo-pic { flex: 0 0 160px; max-width: 100%; }
.game-promo-text { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.game-promo-text .hint { margin: 0; }
.game-hero { flex-direction: row; gap: 20px; flex-wrap: wrap; align-items: center; }
.game-hero-pic { flex: 1 1 240px; min-width: 0; }
.game-hero-text { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.game-hero-text p { margin: 0; }
.light-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.light-list li { display: flex; gap: 10px; align-items: flex-start; }
.lamp {
  flex: none; width: 14px; height: 14px; margin-top: 4px; border-radius: 50%;
  background: var(--lamp); box-shadow: 0 0 0 2px #07121c, 0 0 8px var(--lamp);
}
.lamp.none { background: var(--line); box-shadow: none; }
.vessel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.vessel-tile {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.vessel-tile:hover { border-color: var(--accent); }
.vessel-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.vessel-name { font-weight: 600; line-height: 1.3; }
.vessel-say { font-size: 0.85rem; color: var(--muted); line-height: 1.35; }
.view-seg { flex-wrap: wrap; }
.view-seg button { flex: 1 1 auto; white-space: nowrap; }
.pic-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pic-choice {
  position: relative; font: inherit; color: var(--ink); cursor: pointer; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 6px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.pic-choice:hover:not(:disabled) { border-color: var(--accent); }
.pic-choice .key {
  position: absolute; top: 10px; left: 10px; z-index: 1;
  width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  font: 600 0.85rem var(--font-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);
}
.pic-choice.right { border-color: var(--stbd); background: var(--stbd-soft); }
.pic-choice.right .key { background: var(--stbd); color: #fff; border-color: var(--stbd); }
.pic-choice.wrong { border-color: var(--port); background: var(--port-soft); }
.pic-choice.wrong .key { background: var(--port); color: #fff; border-color: var(--port); }
.pic-choice:disabled { cursor: default; }
.pic-name { font-size: 0.8rem; font-weight: 600; line-height: 1.3; }
.shape-key { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.shape-row { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.shape-row:last-child { border-bottom: 0; padding-bottom: 0; }
.shape-pic {
  flex: none; width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(180deg, #a9d0ec, #e4f1fa);
}
.shape-icon { width: 40px; height: 40px; }
.shape-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.combo-table { display: flex; flex-direction: column; }
.combo-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.combo-row:last-child { border-bottom: 0; }
.combo-row span:last-child { font-weight: 600; }
.flashcard {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch;
  box-shadow: 0 2px 0 var(--line);
}
.flashcard:hover { border-color: var(--accent); }
.flashcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.flashcard.flipped { border-color: var(--accent); border-top: 4px solid var(--accent); }
.flashcard .scene-wrap { display: block; }
.flash-prompt { text-align: center; font-weight: 600; color: var(--accent); padding: 6px 0; }
.flash-answer { display: flex; flex-direction: column; gap: 10px; animation: flash-in 0.2s ease-out; }
.flash-name { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.15; }
@keyframes flash-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .flash-answer { animation: none; } }
.game-card .feedback .light-list { margin: 4px 0; }
@media (max-width: 480px) { .game-promo-pic { flex-basis: 100%; } }

/* Book diagrams */
.diagram-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.diagram {
  margin: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--diagram-bg);
  display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 1 340px; min-width: 0;
}
.diagram figcaption { font: 600 0.72rem var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.tip-btn { border-color: var(--amber); color: var(--amber); }
.tip-btn:hover { border-color: var(--amber); background: var(--amber-soft); }

.tip-rule p { margin: 0; }
.tip-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.trick { margin: 0; }
.trick .label { margin-right: 6px; color: var(--amber); font-weight: 600; }
.why { margin: 0; }
span.why { display: block; }
.why .label { margin-right: 6px; color: var(--stbd); font-weight: 600; }
.mnemonic {
  margin-top: 2px; padding: 10px 12px; border-radius: 8px;

}
.mnemonic .label { color: var(--accent); }
span.mnemonic .device, span.mnemonic .meaning { display: block; }
.mnemonic p { margin: 0; }
.mnemonic .device, .trick-line.device { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; letter-spacing: 0.01em; }
.mnemonic .meaning { font-size: 0.9rem; color: var(--muted); }

.trick-item summary .trick-title:first-child + .trick-line { grid-column: 1 / -1; }

.choice.not-sure.wrong { color: var(--ink); border-style: solid; }

.trick-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  cursor: pointer; list-style: none;

.trick-title { font-weight: 600; min-width: 0; }
.trick-line { grid-column: 2; color: var(--ink); min-width: 0; }
.trick-item[open] summary { margin-bottom: 8px; }
.trick-item p { margin: 0; color: var(--muted); }
.trick-item summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.review-item { border: 1px solid var(--line); border-left: 4px solid var(--port); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }

  "1": {

    idea: "Show lights from sunset to sunrise in all weathers, AND by day in restricted visibility. They may be shown at other times when needed. Don't show other lights that could be mistaken for them or that hurt your lookout. Shapes are shown by day.",

  "21": {
    title: "Light definitions",
    idea: "Masthead light: white, 225°, from right ahead to 22.5° abaft the beam on each side. Sidelights: green starboard, red port, 112.5° each. Sternlight: white, 135° (67.5° each side of dead astern). Towing light: yellow, same arc as a sternlight. All-round light: 360°. Flashing light: 120 or more flashes a minute. Inland special flashing light: yellow, 50–70 flashes a minute, 180°–225° arc, forward on a towed or pushed barge.",
    trick: "112.5 + 112.5 = 225 (the masthead light covers both sidelights). 225 + 135 = 360 (masthead + sternlight = full circle). There's a little red PORT wine left: port = red."

  "22": {

  "23": {
    title: "Power-driven vessels underway",
    idea: "Masthead light forward, sidelights and sternlight. A second masthead light aft and higher is required at 50 m or more (optional when shorter). Under 12 m: may show an all-round white light plus sidelights instead. International, under 7 m and max speed 7 knots or less: an all-round white light. Air cushion vessel in nondisplacement mode: add an all-round flashing yellow light.",

  "24": {
    title: "Towing and pushing",
    idea: "Towing astern: two masthead lights in a vertical line (three if the tow is over 200 m), sidelights, sternlight, and a yellow towing light above the sternlight. Tow over 200 m: a diamond shape by day on the tug and on the tow. Pushing ahead or towing alongside: two masthead lights, sidelights and sternlight (Inland: two yellow towing lights instead of the sternlight). A towed vessel shows sidelights and a sternlight. Inland, a barge pushed ahead shows sidelights and a special flashing light. A composite unit is lit as one power-driven vessel.",
    trick: "Count the whites stacked up front: 2 = towing, 3 = long tow (over 200 m). Yellow over white at the stern = towing astern. Two yellows at the stern (Inland) = pushing ahead."
  },
  "25": {
    title: "Sailing vessels and oars",
    idea: "Sailing vessels underway: sidelights and sternlight. Under 20 m may combine them in one lantern at the masthead. She may add red over green all-round lights at the masthead, but not with the combined lantern. Under 7 m sailing, or a vessel under oars: a white light from a torch or lantern, shown in time to prevent collision. Sailing with the engine running, by day: a cone, point down.",
    trick: "Red over green, sailing machine. Engine on = cone pointing DOWN (the motor pushes down)."
  },
  "26": {
    title: "Fishing vessels",
    idea: "Trawling: green over white all-round lights (plus a masthead light aft and higher if 50 m or more). Other fishing: red over white. Gear out more than 150 m (not trawling): an all-round white light toward the gear by night, a cone point up toward the gear by day. Sidelights and sternlight only when making way. By day: two cones, points together.",
    trick: "Green over white, trawling tonight. Red over white, fishing at night. The two-cone hourglass shape = it's time to fish."
  },
  "27": {
    title: "Not under command and restricted",
    idea: "Not under command (NUC): two all-round red lights, or two balls by day; add sidelights and sternlight when making way. Restricted (RAM): red-white-red lights, or ball-diamond-ball by day; add masthead lights, sidelights and sternlight when making way, and anchor lights when at anchor. Dredging or underwater work with an obstruction: two reds (two balls) on the blocked side, two greens (two diamonds) on the side you may pass. Small diving vessel: a rigid replica of flag A. Mineclearance: three green lights or three balls; keep 1000 m away.",
    trick: "Red over red, the captain is dead (NUC). Red-white-red, restricted ahead (RAM). Two GREENS = go side, two REDS = blocked side."
  },
  "28": {
    title: "Constrained by draft",
    idea: "International only. A power-driven vessel constrained by her draft may show three all-round red lights in a vertical line, or a cylinder by day, in addition to her normal lights.",

  },
  "29": {
    title: "Pilot vessels",
    idea: "On pilotage duty: white over red all-round lights at the masthead. Add sidelights and sternlight when underway, and anchor lights when at anchor. When not on duty, she shows the lights of a normal vessel her size.",

  "30": {
    title: "Anchored and aground",

    trick: "Balls by day: 1 = anchored, 2 = NUC, 3 = aground. More balls, more trouble. Aground = anchored + red over red (she's stuck)."

  "31": {

    idea: "A seaplane or WIG craft that can't show the exact lights shows lights as close as possible to the Rules.",

  "32": {
    title: "Sound definitions",
    idea: "Whistle: any device that can make short and prolonged blasts. Short blast: about 1 second. Prolonged blast: 4 to 6 seconds.",

  "33": {

    idea: "12 m or more: a whistle. 20 m or more: whistle and bell. 100 m or more: whistle, bell and gong. Under 12 m: not required to carry these, but must have some other efficient means of making a sound signal. Manual sounding must always be possible.",
    trick: "12, 20, 100 = whistle, bell, gong."
  },
  "34": {
    title: "Maneuvering and warning signals",
    idea: "International (vessels in sight, when maneuvering): 1 short = altering to starboard, 2 short = altering to port, 3 short = operating astern propulsion. Narrow channel overtaking: 2 prolonged + 1 short = I'll pass on your starboard side, 2 prolonged + 2 short = on your port side, and the reply prolonged-short-prolonged-short means agreed. Inland (within half a mile, meeting or crossing): 1 short = I intend to leave you on my port side, 2 short = on my starboard side; the other vessel answers, and a radio agreement can replace whistles. Doubt or danger: at least 5 short rapid blasts, by either vessel. Near a bend: 1 prolonged, answered by 1 prolonged. Inland, leaving a dock: 1 prolonged.",
    trick: "ONE to the right, TWO to the left, THREE in reverse, FIVE = 'Hey! What are you doing?'"
  },
  "35": {
    title: "Fog signals",
    idea: "Every 2 minutes unless noted. Power-driven making way: 1 prolonged. Power-driven stopped: 2 prolonged. NUC, RAM, CBD, sailing, fishing, towing or pushing: 1 prolonged + 2 short (also fishing or RAM at anchor). Last manned vessel of a tow: 1 prolonged + 3 short, right after the tug's signal. At anchor: rapid bell 5 seconds every minute (100 m or more: add a gong aft); may also sound short-prolonged-short to warn. Aground: 3 bell strokes, rapid bell, 3 bell strokes, every minute. Pilot on duty: may add 4 short. Under 12 m: some efficient signal every 2 minutes. Inland, under 20 m in a special anchorage area: no fog signal needed.",
    trick: "One long, moving along. Two long, stopped and going nowhere. Long-short-short, I'm a special case. One more short for the tow behind. Anchored = bell every minute. Aground = 3 dings, ring, 3 dings. Pilot = 4 shorts."
  },
  "36": {
    title: "Signals to attract attention",
    idea: "Any light or sound signal is allowed to get attention, as long as it can't be mistaken for a signal in the Rules. A searchlight may be pointed toward a danger, but not in a way that blinds another vessel.",
    trick: "'Hey you!' Anything goes as long as it can't be mistaken for a real signal."
  },
  "37": {
    title: "Distress signals",
    idea: "Distress signals (Annex IV) include: continuous sounding of a fog signal, a gun fired about every minute, SOS, MAYDAY, flags N over C, a square flag with a ball above or below it, flames on the vessel, red flares or red star rockets, orange smoke, slowly raising and lowering outstretched arms, an orange flag with a black square and circle, dye marker, and an EPIRB. Five short blasts, green stars, and a waved white lantern are NOT distress signals.",
    trick: "Distress is RED, ORANGE, FIRE or NONSTOP noise. Green is never distress."
  },
  "Annex II": {
    title: "Fishing close together",
    idea: "Trawlers fishing close together may add: shooting (setting) nets = two white lights in a vertical line; hauling nets = white over red; net caught on an obstruction = two red lights. Purse seiners hampered by their gear may show two yellow lights in a vertical line, flashing alternately.",
    trick: "Shooting = white-white, hauling = white-red, stuck = red-red. Purse seiner = yellow-yellow (a purse full of gold)."
  },
  "Annex IV": {
    title: "Distress signals",
    idea: "Distress signals include: continuous fog signal, gun about every minute, SOS, MAYDAY, flags N over C, square flag with a ball, flames on deck, red flares or rockets, orange smoke, raising and lowering outstretched arms, orange flag with black square and circle, dye marker. Not distress: green stars, five short blasts, a white lantern moved up and down.",
    trick: "Distress is RED, ORANGE, FIRE or NONSTOP noise. Green is never distress."
  }

Object.assign(window.QUESTION_TIPS, {
  // ---------- Rules 1–9, both ----------
  "r1-9-both-1": "Rule 1(e): if a vessel's special build or job means it can't meet the light spacing rules, it complies as closely as possible, and its own government decides what that means.",
  "r1-9-both-2": "Rule 2 is the only rule that lets you break the rules, and only to avoid IMMEDIATE danger. Nothing else counts: no traffic, no radar contacts, out of sight of land.",
  "r1-9-both-3": "Rule 2 says you must regard ALL dangers and special circumstances, including the limits of the vessels involved (backing power, radar info, what the other vessel is doing). That's why it's 'all of the above'.",
  "r1-9-both-4": "Same idea as Rule 2(b): departing from the rules is allowed only when it's necessary to avoid immediate danger. The Master's log entry or an empty sea don't count.",
  "r1-9-both-5": "'In sight' means seen with your EYES. Radar and fog signals don't count, which is why Rule 19 (restricted visibility) uses different rules for radar-only contacts.",
  "r1-9-both-6": "Underway = not anchored, not made fast to shore, not aground. A drifting vessel with its engine off is still underway (just not making way).",
  "r1-9-both-7": "NUC = something went WRONG (an exceptional circumstance like a broken engine or steering). If the limit comes from her WORK, she's RAM instead.",
  "r1-9-both-8": "Breadth = GREATEST breadth, the widest point of the hull. Pairs with length = length OVERALL. The Rules always use the biggest measurement.",
  "r1-9-both-9": "Length = LENGTH OVERALL (tip to tip), never waterline or register length. Pair it with 'breadth = greatest breadth'.",
  "r1-9-both-10": "A deep-draft vessel is limited by the water depth, not by her work, so she isn't RAM. (Internationally she may be 'constrained by draft', a different category.)",
  "r1-9-both-11": "A tow only counts as RAM when the towing job SEVERELY restricts the tug and tow from changing course. Ordinary towing is just power-driven.",
  "r1-9-both-12": "RAM = restricted by the nature of her WORK. NUC = restricted by an exceptional circumstance (breakdown). Weather or a lost rudder are not 'work'.",
  "r1-9-both-13": "Key word for RAM: 'nature of her WORK' (dredging, cable laying, servicing a buoy, replenishing). Draft = CBD, exceptional circumstance = NUC.",
  "r1-9-both-14": "A composite unit (pusher locked into a barge) is lit and treated as one power-driven vessel, not RAM. Transferring provisions, servicing a navigation mark and launching aircraft are all RAM jobs.",
  "r1-9-both-15": "An anchored vessel isn't RAM just because it's anchored. RAM is about a working job that limits maneuvering (picking up a mark, transferring cargo underway, a restricted tow).",
  "r1-9-both-16": "A sailing vessel has its own category and isn't RAM. Servicing a mark, mineclearing and dredging are classic RAM jobs from the Rule 3 list.",
  "r1-9-both-17": "NUC and RAM are separate categories. Laying pipeline, dredging and mineclearing are RAM; 'not under command' is the odd one out.",
  "r1-9-both-18": "Mineclearing is listed in Rule 3 as RAM. Fishing has its own category, lost steering is NUC, deep draft is CBD.",
  "r1-9-both-19": "Replenishing or transferring people, stores or cargo while underway is on the Rule 3 list of RAM jobs.",
  "r1-9-both-20": "Dredging is RAM. Anchoring, fishing and ordinary towing are not.",
  "r1-9-both-21": "Laying revetment mats (bank protection) is underwater work, so RAM. A deep-draft ship = CBD, a trawler = fishing, a dead ship under tow = being towed.",
  "r1-9-both-22": "Restricted visibility = ANY cause: fog, mist, falling snow, heavy rain, sandstorms. There's no distance cutoff in the Rules.",
  "r1-9-both-23": "In sight = can be observed VISUALLY from the other vessel. Not radar, not hearing a fog signal.",
  "r1-9-both-24": "Engine running = power-driven, even with the sails up. By day she shows a cone, point down.",
  "r1-9-both-25": "Underway = not anchored, not made fast, not aground. A fishing vessel hauling nets isn't tied to anything, so she's underway. Moored to a buoy, anchored or aground are not.",
  "r1-9-both-26": "Power-driven = ANY vessel propelled by machinery: a sailboat using its engine, a canoe with an outboard, a diesel tug.",
  "r1-9-both-27": "The machinery must be IN USE. A sailboat with an engine that's switched off is a sailing vessel.",
  "r1-9-both-28": "RAM is 'unable to keep out of the way' by definition, because of her work. Fishing, sailing and towing vessels can still maneuver to some degree.",
  "r1-9-both-29": "'Vessel' includes seaplanes, WIG craft and nondisplacement craft. Trolling isn't fishing, and fishing vessels aren't RAM.",
  "r1-9-both-30": "'Vessel' = every watercraft used or capable of being used for transport on water: seaplanes, nondisplacement craft, barges and so on.",
  "r1-9-both-31": "Fishing = gear that RESTRICTS maneuverability (nets, lines, trawls). Having gear aboard or trolling lines out doesn't count.",
  "r1-9-both-32": "Fishing vessels use nets, lines or trawls that restrict maneuvering. Trolling doesn't count, they're not RAM, and their fog signal is long-short-short, not two prolongeds.",
  "r1-9-both-33": "Trolling lines don't restrict maneuvering, so a troller is NOT 'engaged in fishing'. Setting nets, trawling and dredge nets all are.",
  "r1-9-both-34": "'Vessel' covers sailing ships, nondisplacement craft (hovercraft) and seaplanes. All of the above.",
  "r1-9-both-35": "Rule 5: a lookout is kept at ALL times, in every condition: fog, night, heavy traffic.",
  "r1-9-both-36": "Lookout = at ALL times, by sight, hearing and all available means (radar too).",
  "r1-9-both-37": "Safe speed = at ALL times, not just in fog or traffic.",
  "r1-9-both-38": "Safe speed = a speed that lets you take proper and effective action to avoid collision and stop in a distance appropriate to the conditions.",
  "r1-9-both-39": "Stop within a distance APPROPRIATE to the circumstances, not a fixed distance like 'half the visibility'.",
  "r1-9-both-40": "Rule 6 factors include your MANEUVERABILITY (stopping distance, turning ability). Construction and crew experience are not on the list.",
  "r1-9-both-41": "Rule 6 lists the state of wind, sea and current and nearby navigation hazards. Top speed and temperature aren't factors.",
  "r1-9-both-42": "Horsepower isn't a safe-speed factor. Background lights at night, your draft compared to depth, and maneuverability all are.",
  "r1-9-both-43": "Risk of collision needs an APPROACHING vessel. She can be power or sail, and anywhere around you, not just forward of the beam.",
  "r1-9-both-44": "Rule 7: if in DOUBT, risk of collision exists. Never assume it doesn't.",
  "r1-9-both-45": "Constant bearing + decreasing range = risk of collision, even from the quarter. The other choices have the range opening or the bearing changing.",
  "r1-9-both-46": "Rule 7 says use ALL available means: compass bearings, radar plotting and long-range radar scanning.",
  "r1-9-both-48": "CBDR: Constant Bearing, Decreasing Range = collision course.",
  "r1-9-both-50": "Bearing not changing on an approaching vessel = risk of collision. It says nothing about who stands on.",
  "r1-9-both-51": "Rule 7(d): risk exists if the compass bearing of an approaching vessel does NOT appreciably change.",
  "r1-9-both-52": "If you have working radar you MUST use it properly, including long-range scanning for early warning. It doesn't replace the lookout or justify higher speed.",
  "r1-9-both-53": "Risk of collision is judged with radar scanning, radar plotting and compass bearings. All of them.",
  "r1-9-both-54": "A changing bearing doesn't guarantee safety: with a very large ship, a tow, or at close range, risk can exist even while the bearing changes.",
  "r1-9-both-55": "If radar is fitted it MUST be used properly to judge risk of collision. There's no fixed 'half a mile' rule.",
  "r1-9-both-57": "Rule 8: action must be POSITIVE, made in AMPLE TIME, with good seamanship. No sound signal or speed change is automatically required.",
  "r1-9-both-58": "A course change alone can work if it's made early, is LARGE and doesn't create another close-quarters situation. Small, repeated changes are what to avoid.",
  "r1-9-both-60": "Slow, stop or reverse to avoid collision OR to give yourself more time to assess the situation. All of the above.",
  "r1-9-both-61": "Rule 9: a fishing vessel must not impede ANY vessel navigating within a narrow channel, including a sailboat.",
  "r1-9-both-62": "Under 20 m, or a sailing vessel, shall not impede a vessel that can only navigate safely within the narrow channel.",
  "r1-9-both-63": "Narrow channel: keep to the STARBOARD side, like driving on the right side of the road.",
  "r1-9-both-64": "Keep as near to the outer edge of the channel on your STARBOARD side as is safe and practicable.",
  "r1-9-both-65": "Your tug is under 20 m and the container ship can only navigate inside the channel, so you must not impede her, even though she's on your port side.",
  "r1-9-both-66": "Under 20 m crossing a channel: you must not impede a vessel that can only navigate within it. Size and current don't create 'right of way'.",
  "r1-9-both-67": "Rule 9: under 20 m, sailing, and fishing vessels all must not impede a vessel confined to a narrow channel.",
  // ---------- Rules 1–9, Inland ----------
  "r1-9-inland-1": "'Constrained by draft' exists ONLY in the International Rules. Inland has no CBD category, lights or shape.",
  "r1-9-inland-2": "Inland waters include the Great Lakes on the U.S. side of the boundary, plus harbors and rivers shoreward of the COLREGS demarcation lines.",
  "r1-9-inland-3": "Inland waters = Western Rivers + U.S. side of the Great Lakes + waters inside the COLREGS demarcation lines. All of the above.",
  "r1-9-inland-4": "The Western Rivers (Mississippi system) are inland waters down to the COLREGS demarcation line.",
  "r1-9-inland-7": "Great Lakes and Western Rivers: the DOWNBOUND vessel with a following current has the right of way and PROPOSES how to pass.",
  "r1-9-inland-8": "The downbound vessel (going with the current) sounds the first passing signal; she's the hardest to stop.",
  "r1-9-inland-9": "Downbound with a following current: she has the right of way, starts the signals and proposes the manner and place of passing. All three.",
  // ---------- Rules 1–9, International ----------
  "r1-9-intl-1": "International Rules (COLREGS) = the high seas and all connecting waters navigable by seagoing vessels.",
  "r1-9-intl-2": "Only a POWER-DRIVEN vessel can be 'constrained by her draft'. She's not NUC or RAM, and she isn't towed.",
  "r1-9-intl-3": "CBD = severely restricted in changing course because of her draft compared to the available depth. No length limit, and it isn't limited to marked channels.",

  "r1-9-intl-6": "Fishing vessels must not impede you in a narrow channel, but if you're in DOUBT about their intentions you MAY sound the danger signal (5 short).",
  // ---------- Rules 10–19, both ----------
  "r10-19-both-68": "Sailing, different tacks: PORT tack keeps clear of STARBOARD tack. 'Starboard tack stands on.'",
  "r10-19-both-69": "Starboard tack stands on. The tack is the side the wind comes over (the side opposite the main boom).",
  "r10-19-both-70": "Port-tack sailor who can't tell the windward boat's tack must KEEP CLEAR. When in doubt, give way.",
  "r10-19-both-71": "Same tack: the WINDWARD vessel keeps clear of the leeward one. 'Windward gives way.'",
  "r10-19-both-73": "Overtaking beats everything: even a sailboat that's overtaking is the give-way vessel.",
  "r10-19-both-74": "The vessel being overtaken (B) is the stand-on vessel. The one catching up keeps clear.",
  "r10-19-both-75": "Coming from dead astern (180° relative) = overtaking. Overtaking is anything from more than 22.5° abaft the beam.",
  "r10-19-both-76": "Sailboats usually stand on over power, EXCEPT when they're overtaking (Rule 13 overrides Rule 18).",

  "r10-19-both-80": "Overtaking = approaching from more than 22.5° abaft the beam. That's exactly where the sidelights stop showing.",

  "r10-19-both-83": "Once overtaking, always overtaking: a later change of bearing doesn't turn it into a crossing situation.",
  "r10-19-both-84": "The overtaking vessel keeps out of the way. She is never the stand-on vessel.",
  "r10-19-both-85": "Nearly head-on: both alter to starboard and pass PORT to PORT.",
  "r10-19-both-86": "Head-on is the only situation where BOTH vessels must turn (both to starboard).",
  "r10-19-both-87": "Head-on: each alters course to STARBOARD. Red to red.",
  "r10-19-both-88": "A towing vessel is still power-driven unless she's declared RAM, so head-on means both turn to starboard and pass port to port.",
  "r10-19-both-89": "Towing doesn't change the head-on rule: both alter to starboard and pass port to port.",

  "r10-19-both-95": "Stopped but not disabled = still a power-driven vessel underway. A vessel on your starboard side means you give way.",

  "r10-19-both-98": "Give-way vessel: avoid crossing AHEAD of the stand-on vessel. Turning to starboard, slowing or backing are all fine.",

    },
    {
      id: "anchor-large", name: "At anchor, 50 m or more", group: "anchor", hull: "ship",

      day: "anchor",

      about: "All-round white forward and a second, lower one aft. 100 m or more also lights up her decks. By day, one ball forward.",
    },
    {
      id: "aground", name: "Aground", group: "anchor", hull: "ship",
      lights: { anchor: 2, stack: ["red", "red"] },
      day: ["ball", "ball", "ball"],
      say: "Anchor lights plus red over red: stuck on the bottom. Three balls by day.",
      stackSays: "Red over red all-round with anchor lights: she's aground.",
      about: "Anchor lights plus two all-round red lights in a vertical line. By day, three balls.",
    },
  ];
  const byId = new Map(VESSELS.map((v) => [v.id, v]));

  const VIEWS = {
    ahead: "From ahead",
    stbd: "Starboard side",
    port: "Port side",
    astern: "From astern",
    day: "Day shapes",
  };

  // ---------- Light colors and meanings ----------
  const COLOR = { white: "#f5f8ff", red: "#ff4136", green: "#3ce67f", yellow: "#ffcc33" };

  const LIGHT_KEY = [
    ["white", "Masthead light", "White, shines forward over 225°. Means: a power-driven vessel underway. Two or three stacked on one mast = towing."],
    ["red", "Port sidelight", "Red, 112.5° on the left side. You're looking at her port side."],
    ["green", "Starboard sidelight", "Green, 112.5° on the right side. You're looking at her starboard side. Red and green together = she's heading at you."],
    ["white", "Sternlight", "White, 135° over the stern. Seeing only this = you're behind her (overtaking)."],
    ["yellow", "Towing light", "Yellow, same arc as the sternlight, placed above it. Means: towing astern."],
    ["white", "All-round light", "Shines 360°. Anchor lights and the signal lights (red over red, red-white-red, green over white…) are all-round."],
    ["yellow", "Flashing yellow", "All-round flashing yellow = hovercraft. Inland: a special flashing yellow at the bow = barge pushed ahead."],
  ];

  // ---------- Drawing ----------
  const W = 320, H = 200;
  const mirror = (x) => W - x;

  function hullPath(hull, view) {
    const side = view === "stbd" || view === "port";
    let d;
    if (hull === "barge") {
      d = side ? "M60 132 H262 V156 H66 Z" : "M112 132 H208 V156 H112 Z";
    } else if (hull === "small") {
      d = side ? "M110 140 H226 L214 156 H118 Z M140 128 H180 V140 H140 Z" : "M140 140 H180 L174 156 H146 Z M146 128 H174 V140 H146 Z";
    } else if (hull === "sail") {
      d = side ? "M70 140 H262 L240 158 H86 Z M159 140 V36 H162 V140 Z" : "M136 140 H184 L172 158 H148 Z M159 140 V36 H162 V140 Z";
    } else {
      d = side
        ? "M38 136 H284 L268 158 H52 Z M78 112 H146 V136 H78 Z M209 136 V60 H212 V136 Z M119 112 V40 H122 V112 Z"
        : "M118 136 H202 L188 158 H132 Z M126 112 H194 V136 H126 Z";
    }
    if (side && view === "port") d = mirrorPath(d);
    return d;
  }
  function mirrorPath(d) {
    // Mirror the x coordinates of a path made of M/H/V/L/Z commands.
    return d.replace(/([MHL])\s*([\d.]+)/g, (_, c, x) => `${c}${mirror(Number(x))}`);
  }

  // Work out which lights show from a view, with coordinates and what each one means.
  function lightsFor(v, view) {
    const L = v.lights;
    const out = [];
    const add = (x, y, c, role, opts = {}) => out.push(Object.assign({ x, y, c, role }, opts));
    const side = view === "stbd" || view === "port";
    const sx = (x) => (view === "port" ? mirror(x) : x);

    if (view === "ahead" || side) {
      if (L.mh) {
        const x = side ? sx(210) : 160;
        const base = L.mine ? 96 : 92;
        for (let i = 0; i < L.mh; i++) add(x, base - i * 14, "white", L.mh > 1 ? "mhStack" : "mh");
      }
      if (L.mhAft) add(side ? sx(120) : 160, 46, "white", "mhAft");
      if (L.sides) {
        if (view === "ahead") { const narrow = v.hull === "sail" || v.hull === "small"; add(narrow ? 140 : 128, narrow ? 142 : 124, "green", "side"); add(narrow ? 180 : 192, narrow ? 142 : 124, "red", "side"); }
        else add(sx(228), 124, view === "stbd" ? "green" : "red", "side");
      }
      if (L.special) add(side ? sx(258) : 160, 126, "yellow", "special", { flashing: true });
    }
    if (view === "astern") {
      if (L.tow === 2) { add(160, 134, "yellow", "tow2"); add(160, 120, "yellow", "tow2"); }
      else {
        if (L.stern) add(160, 134, "white", "stern");
        if (L.tow === 1) add(160, 120, "yellow", "tow1");
      }
    }
    // All-round lights show from every direction.
    if (L.stack) {
      const x = side ? sx(166) : view === "ahead" ? 140 : 180;
      const n = L.stack.length;
      L.stack.forEach((c, i) => add(x, 100 - (n - 1 - i) * 16, c, "stack"));
    }
    if (L.mastTop) L.mastTop.forEach((c, i) => add(160.5, 30 + i * 15, c, "mastTop"));
    if (L.anchor) {
      add(side ? sx(268) : 160, 92, "white", "anchor");
      if (L.anchor === 2) add(side ? sx(46) : 160, 116, "white", "anchor");
    }
    if (L.allWhite) add(side ? sx(160) : 160, 104, "white", "allWhite");
    if (L.flash) add(side ? sx(120) : 184, 66, "yellow", "flash", { flashing: true });
    if (L.mine) {
      const x = side ? sx(210) : 160;
      add(x, 52, "green", "mine");
      if (side) add(x, 68, "green", "mine");
      else { add(x - 20, 68, "green", "mine"); add(x + 20, 68, "green", "mine"); }
    }
    if (L.pairs) {
      // Port side is the obstructed side in these drawings.
      const portX = view === "ahead" ? 206 : view === "astern" ? 114 : null;
      const stbdX = view === "ahead" ? 114 : view === "astern" ? 206 : null;
      if (side) {
        const c = view === "stbd" ? "green" : "red";
        add(sx(192), 96, c, "pair"); add(sx(192), 112, c, "pair");
      } else {
        add(portX, 96, "red", "pair"); add(portX, 112, "red", "pair");
        add(stbdX, 96, "green", "pair"); add(stbdX, 112, "green", "pair");
      }
    }
    return out;
  }

  function nightSVG(v, view, opts = {}) {
    const lights = lightsFor(v, view);
    const uid = "g" + Math.random().toString(36).slice(2, 8);
    const hull = opts.hideHull ? "" : `<path d="${hullPath(v.hull, view)}" fill="#162838" stroke="#22394d" stroke-width="1"/>`;
    const dots = lights.map((l) => `
      <g class="${l.flashing ? "flashing" : ""}">
        <circle cx="${l.x}" cy="${l.y}" r="11" fill="${COLOR[l.c]}" opacity="0.28" filter="url(#${uid})"/>
        <circle cx="${l.x}" cy="${l.y}" r="4.6" fill="${COLOR[l.c]}"/>
        <circle cx="${l.x - 1.2}" cy="${l.y - 1.2}" r="1.6" fill="#fff" opacity="0.7"/>
      </g>`).join("");
    const label = opts.label ? `<text x="10" y="20" class="svg-label">${opts.label}</text>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" class="scene night" role="img" aria-label="${opts.aria || "Night view"}">
      <defs><filter id="${uid}" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="4"/></filter></defs>
      <rect width="${W}" height="${H}" fill="#07121c"/>
      <rect y="150" width="${W}" height="50" fill="#0a1824"/>
      <line x1="0" y1="150" x2="${W}" y2="150" stroke="#12283a" stroke-width="1"/>
      ${hull}${dots}${label}
    </svg>`;
  }

  // Day shapes are drawn on the side view.
  function shape(kind, x, y) {
    const s = "#111";
    switch (kind) {
      case "ball": return `<circle cx="${x}" cy="${y}" r="8" fill="${s}"/>`;
      case "diamond": return `<polygon points="${x},${y - 11} ${x + 8},${y} ${x},${y + 11} ${x - 8},${y}" fill="${s}"/>`;
      case "coneUp": return `<polygon points="${x},${y - 9} ${x + 9},${y + 8} ${x - 9},${y + 8}" fill="${s}"/>`;
      case "coneDown": return `<polygon points="${x - 9},${y - 8} ${x + 9},${y - 8} ${x},${y + 9}" fill="${s}"/>`;
      case "cylinder": return `<rect x="${x - 7}" y="${y - 11}" width="14" height="22" rx="2" fill="${s}"/>`;
      case "hourglass": return `<polygon points="${x - 9},${y - 18} ${x + 9},${y - 18} ${x},${y}" fill="${s}"/><polygon points="${x},${y} ${x + 9},${y + 18} ${x - 9},${y + 18}" fill="${s}"/>`;
      case "flagA": return `<g><rect x="${x - 1}" y="${y - 14}" width="2" height="34" fill="#333"/>
        <polygon points="${x + 1},${y - 14} ${x + 17},${y - 14} ${x + 17},${y + 10} ${x + 1},${y + 10}" fill="#fff" stroke="#333" stroke-width="0.8"/>
        <polygon points="${x + 17},${y - 14} ${x + 36},${y - 14} ${x + 28},${y - 2} ${x + 36},${y + 10} ${x + 17},${y + 10}" fill="#1f4fb5" stroke="#333" stroke-width="0.8"/></g>`;
    }
    return "";
  }
  function daySVG(v, opts = {}) {
    const view = "stbd";
    const hullD = hullPath(v.hull, view);
    let shapes = "";
    let rigging = "";
    if (v.day === "anchor") {
      shapes = shape("ball", 262, 100);
      rigging = `<line x1="211" y1="62" x2="282" y2="136" stroke="#4d5964" stroke-width="1"/>`;
    } else if (v.day === "mine") {
      rigging = `<line x1="190" y1="70" x2="230" y2="70" stroke="#4d5964" stroke-width="2"/>`;
      shapes = shape("ball", 210, 50) + shape("ball", 190, 80) + shape("ball", 230, 80);
    } else if (v.day === "dredge") {
      rigging = `<line x1="166" y1="136" x2="166" y2="34" stroke="#4d5964" stroke-width="2"/><line x1="132" y1="74" x2="200" y2="74" stroke="#4d5964" stroke-width="2"/>`;
      shapes = shape("ball", 166, 44) + shape("diamond", 166, 66) + shape("ball", 166, 88)
        + shape("ball", 136, 86) + shape("ball", 136, 106)
        + shape("diamond", 196, 88) + shape("diamond", 196, 112)
        + `<text x="112" y="24" class="svg-tag">blocked side</text><text x="186" y="24" class="svg-tag">pass side</text>`;
    } else if (Array.isArray(v.day)) {
      const x = v.hull === "sail" ? 200 : v.hull === "barge" ? 160 : 166;
      if (v.hull !== "sail") rigging = `<line x1="${x}" y1="${v.hull === "barge" ? 132 : 136}" x2="${x}" y2="34" stroke="#4d5964" stroke-width="2"/>`;
      else rigging = `<line x1="161" y1="40" x2="250" y2="138" stroke="#4d5964" stroke-width="1"/>`;
      let y = v.hull === "sail" ? 92 : 46;
      v.day.forEach((k) => {
        const h = k === "hourglass" ? 40 : k === "flagA" ? 30 : 24;
        shapes += shape(k, x, y + h / 2 - 12);
        y += h;
      });
    }
    const sail = v.hull === "sail" ? `<polygon points="163,40 163,134 236,134" fill="#eef1f4" stroke="#b9c3cc"/>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" class="scene day" role="img" aria-label="${opts.aria || "Day shapes"}">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d0ec"/><stop offset="1" stop-color="#e4f1fa"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#sky)"/>
      <rect y="150" width="${W}" height="50" fill="#4f7d9c"/>
      ${sail}
      <path d="${hullD}" fill="#5c6873" stroke="#46515b" stroke-width="1"/>
      ${rigging}${shapes}
    </svg>`;
  }

  function picture(v, view, opts) {
    return view === "day" ? daySVG(v, opts) : nightSVG(v, view, opts);
  }

  // What each visible light means, for the explanation under a picture.
  function meanings(v, view) {
    if (view === "day") {
      const names = { ball: "ball", diamond: "diamond", coneUp: "cone point up", coneDown: "cone point down", cylinder: "cylinder", hourglass: "two cones, points together", flagA: "flag A" };
      const what = v.day === "anchor" ? "One ball forward"
        : v.day === "mine" ? "Three balls (masthead and both yardarms)"
        : v.day === "dredge" ? "Ball-diamond-ball, two balls on the blocked side, two diamonds on the passing side"
        : v.day.map((k) => names[k]).join(" over ");
      return [[null, what + (v.dayNote ? `. ${v.dayNote}` : "")]];
    }
    const lights = lightsFor(v, view);
    const roles = new Set(lights.map((l) => l.role));
    const rows = [];
    const L = v.lights;
    if (roles.has("mhStack")) rows.push(["white", `${L.mh} white masthead lights in a vertical line: ${L.tow === 2 || !L.tow ? "pushing ahead or towing alongside" : L.mh === 3 ? "towing, tow over 200 m" : "towing, tow 200 m or less"}.`]);
    if (roles.has("mh")) rows.push(["white", "White masthead light: power-driven and underway."]);
    if (roles.has("mhAft")) rows.push(["white", "Second, higher masthead light aft: 50 m or longer. The pair shows her heading."]);
    if (roles.has("side")) {
      if (view === "ahead") rows.push(["green", "Red and green sidelights together: she's heading straight at you."]);
      else rows.push([view === "stbd" ? "green" : "red", view === "stbd" ? "Green sidelight: you see her starboard side." : "Red sidelight: you see her port side."]);
    }
    if (roles.has("stern")) rows.push(["white", "White sternlight: you're behind her."]);
    if (roles.has("tow1")) rows.push(["yellow", "Yellow towing light above the sternlight: towing astern."]);
    if (roles.has("tow2")) rows.push(["yellow", "Two yellow towing lights (Inland): pushing ahead or towing alongside."]);
    if (roles.has("stack")) rows.push([L.stack[0], v.stackSays]);
    if (roles.has("mastTop")) rows.push(["red", "Red over green at the masthead: a sailing vessel."]);
    if (roles.has("anchor")) rows.push(["white", L.anchor === 2 ? "Two all-round whites, forward one higher: anchored (or aground), 50 m or more." : "One all-round white: anchored."]);
    if (roles.has("allWhite")) rows.push(["white", "One all-round white: small power-driven vessel under 12 m."]);
    if (roles.has("flash")) rows.push(["yellow", "Flashing yellow all-round: air cushion vessel (hovercraft)."]);
    if (roles.has("special")) rows.push(["yellow", "Special flashing yellow at the bow (Inland): barge being pushed ahead."]);
    if (roles.has("mine")) rows.push(["green", "Three all-round greens: mineclearance. Keep 1000 m away."]);
    if (roles.has("pair")) rows.push(["green", view === "stbd" ? "Two greens on this side: safe to pass here." : view === "port" ? "Two reds on this side: obstruction. Don't pass here." : "Two reds = obstruction on that side. Two greens = pass on that side."]);
    if (!lights.length) rows.push([null, "No lights show from this angle."]);
    return rows;
  }

  // Two pictures that look the same to a viewer shouldn't be offered as different answers.
  function signature(v, view) {
    if (view === "day") return "day:" + JSON.stringify(v.day);
    const lights = lightsFor(v, view);
    const colors = lights.map((l) => l.c + (l.flashing ? "*" : "")).sort().join(",");
    const cols = new Map();
    for (const l of lights) {
      const key = Math.round(l.x / 8);
      if (!cols.has(key)) cols.set(key, []);
      cols.get(key).push(l);
    }
    const stacks = [...cols.values()].filter((c) => c.length > 1)
      .map((c) => c.sort((a, b) => a.y - b.y).map((l) => l.c).join("-")).sort().join("|");
    return colors + "#" + stacks;
  }
  function viewsFor(v) {
    const vs = ["ahead", "stbd", "port", "astern"].filter((w) => lightsFor(v, w).length);
    if (v.day) vs.push("day");
    return vs;
  }

  // ---------- Screens ----------
  let root = null, onExit = null, state = null;
  const STORE = "rotr-game-v1";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function loadBest() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function saveBest(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) { /* storage unavailable */ } }
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  // ---------- Mnemonics (shared with the quizzes, from data/mnemonics.js) ----------
  // Which device goes with each vessel: night lights, day shapes, and (where different) the view from astern.
  const VESSEL_MN = {
    "power-small": { night: "powerlights" }, "power-large": { night: "powerlights" }, "power-tiny": { night: "sizes" },
    hovercraft: { night: "hover" }, sail: { night: "sailbasic" }, "sail-rg": { night: "sailrg" },
    motorsail: { night: "motorsail", day: "motorsail" },
    "tow-short": { night: "towcount", astern: "towstern" }, "tow-long": { night: "towcount", astern: "towstern", day: "towcount" },
    "push-intl": { night: "push" }, "push-inland": { night: "push" }, towed: { night: "towed", day: "towcount" },
    "barge-pushed": { night: "specialflash" },
    trawl: { night: "trawl", day: "hourglass" }, fish: { night: "trawl", day: "hourglass" }, "fish-stopped": { night: "fishway", day: "hourglass" },
    "nuc-way": { night: "nuc", day: "balls" }, "nuc-stopped": { night: "nuc", day: "balls" },
    "ram-way": { night: "ramlights", day: "ramlights" }, "ram-anchor": { night: "ramlights", day: "ramlights" },
    dredge: { night: "dredge", day: "dredge" }, diving: { night: "ramlights", day: "flagA" }, mine: { night: "mine", day: "mine" },
    cbd: { night: "cbd", day: "cbd" }, pilot: { night: "pilot" }, "pilot-anchor": { night: "pilot" },
    "anchor-small": { night: "anchorlights", day: "balls" }, "anchor-large": { night: "anchorlights", day: "balls" },
    aground: { night: "aground", day: "balls" },
  };
  const SHAPE_MN = { ball: "balls", diamond: "towcount", hourglass: "hourglass", coneUp: "gear", coneDown: "motorsail", cylinder: "cbd", flagA: "flagA" };
  function mnemonic(key) {
    const m = key && (window.MNEMONICS || {})[key];
    return m ? `<div class="mnemonic"><span class="label">Mnemonic · ${esc(m[0])}</span>
      <p class="device">${esc(m[1])}</p><p class="meaning">${esc(m[2])}</p></div>` : "";
  }
  function vesselKey(v, view) {
    const m = VESSEL_MN[v.id] || {};
    return view === "day" ? (m.day || m.night) : view === "astern" ? (m.astern || m.night) : m.night;
  }
  function vesselMnemonic(v, view) { return mnemonic(vesselKey(v, view)); }
  function vesselWhy(v, view, tag = "p") {
    const why = (window.MNEMONIC_WHY || {})[vesselKey(v, view)];
    return why ? `<${tag} class="why"><span class="label">Why this rule exists</span> ${esc(why)}</${tag}>` : "";
  }

  function dotRow(rows) {
    return `<ul class="light-list">${rows.map(([c, t]) =>
      `<li>${c ? `<span class="lamp" style="--lamp:${COLOR[c]}"></span>` : `<span class="lamp none"></span>`}<span>${esc(t)}</span></li>`).join("")}</ul>`;
  }

  function home() {
    state = null; flash = null;

  const GROUPS = [
    ["power", "Power-driven"], ["sail", "Sailing"], ["tow", "Towing and pushing"], ["fish", "Fishing"],

  function learn(openId) {

  function card(id, view, from = "lights") {
    const v = byId.get(id);
    const views = viewsFor(v);

  // ---------- Learn the shapes ----------
  const SHAPE_KEY = [
    ["ball", "Ball", "1 ball = anchored. 2 balls = not under command. 3 balls = aground. Top and bottom of ball-diamond-ball = restricted. 3 balls on the mast and yardarms = mineclearance.", "More balls, more trouble: 1 anchored, 2 broken, 3 stuck."],
    ["diamond", "Diamond", "Tow over 200 m (on the tug and on the tow). Middle of ball-diamond-ball = restricted in ability to maneuver. Two diamonds = the side of a dredge you may pass.", "Diamond = a long tow, like a long string of diamonds."],
    ["hourglass", "Two cones, points together", "Fishing: trawling or any other fishing.", "The hourglass says it's time to fish."],
    ["coneUp", "Cone, point up", "Fishing gear stretching more than 150 m from the boat, shown toward the gear.", "Point up, the gear is out."],
    ["coneDown", "Cone, point down", "A sailing vessel that is also using her engine.", "Engine on = cone points down, like the motor pushing down."],
    ["cylinder", "Cylinder", "Constrained by her draft (International only).", "CBD = Cylinder By Day."],
    ["flagA", "Code flag A", "A small vessel with divers down, when she can't show ball-diamond-ball.", "Flag A: Alpha, divers Below."],
  ];
  const SHAPE_COMBOS = [
    ["One ball", "Anchored"], ["Two balls", "Not under command"], ["Three balls in a line", "Aground"],
    ["Ball-diamond-ball", "Restricted in ability to maneuver"], ["Three balls in a triangle (mast + yardarms)", "Mineclearance, keep 1000 m away"],
    ["Ball-diamond-ball + 2 balls one side, 2 diamonds the other", "Dredging: pass on the diamond side"],
    ["Diamond", "Towing, tow over 200 m"], ["Two cones, points together", "Fishing"],
    ["Cone, point down", "Sailing and motoring"], ["Cylinder", "Constrained by draft"], ["Flag A", "Divers down"],
  ];
  function shapeIcon(kind) {
    const vb = kind === "flagA" ? "-6 -18 48 40" : kind === "hourglass" ? "-14 -22 28 44" : "-14 -14 28 28";
    return `<svg viewBox="${vb}" class="shape-icon" aria-hidden="true">${shape(kind, 0, 0)}</svg>`;
  }
  function learnShapes() {
    state = null; flash = null;
    const dayVessels = VESSELS.filter((v) => v.day);
    root.innerHTML = `
      <div class="actions"><button class="btn" id="g-home">Back to game</button><button class="btn primary" id="g-flash">Flash cards: day shapes</button><button class="btn" id="g-learn">Learn the lights</button></div>
      <section class="card">
        <h2>Learn the shapes</h2>
        <p class="hint">Day shapes are black and hung where they can best be seen. They do the job of the signal lights in daylight.</p>
        <ul class="shape-key">${SHAPE_KEY.map(([k, name, means, trick]) => `
          <li class="shape-row">
            <span class="shape-pic">${shapeIcon(k)}</span>
            <span class="shape-text">
              <strong>${esc(name)}</strong>
              <span>${esc(means)}</span>
              <span class="trick"><span class="label">Remember</span> ${esc(trick)}</span>
              ${mnemonic(SHAPE_MN[k]).replace(/<(\/?)(div|p)\b/g, "<$1span")}
            </span>
          </li>`).join("")}</ul>

        <h2>Quick reference</h2>
        <div class="combo-table" role="table" aria-label="Day shapes and what they mean">
          ${SHAPE_COMBOS.map(([a, b]) => `<div class="combo-row" role="row"><span role="cell">${esc(a)}</span><span role="cell">${esc(b)}</span></div>`).join("")}
        </div>
      </section>
      <section class="card">
        <h2>Vessels and their shapes</h2>
        <div class="vessel-grid">${dayVessels.map((v) => `
          <button type="button" class="vessel-tile" data-open="${v.id}">
            ${daySVG(v, { aria: v.name + " day shapes" })}
            <span class="vessel-name">${esc(v.name)}</span>
            <span class="vessel-say">${esc(v.say)}</span>
          </button>`).join("")}</div>
      </section>`;
    root.querySelector("#g-home").addEventListener("click", home);
    root.querySelector("#g-learn").addEventListener("click", () => learn());
    root.querySelector("#g-flash").addEventListener("click", () => {
      try { localStorage.setItem(STORE + "-flash", "day"); } catch (e) { /* storage unavailable */ }
      flashStart("day");

    root.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => card(el.dataset.open, "day", "shapes")));
    window.scrollTo(0, 0);
